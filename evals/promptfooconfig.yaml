description: >-
  VITALCOM — baseline congelada de evals por etapa (T11, odd/tasks/g07-cimientos.md).
  Cada test corre un assert Python determinista sobre un fixture congelado de un
  output REAL guardado en PRODUCTOS/. El provider `echo` solo devuelve el fixture
  tal cual (no llama a ningún modelo): esta baseline mide contratos de output, no
  calidad de generación. Sirve como piso: antes de podar prosa de un
  .claude/agents/ETAPA-*.md, esta config debe seguir pasando igual sobre el mismo
  output re-generado.

providers:
  - id: echo

prompts:
  - "{{content}}"

defaultTest:
  vars: {}

tests:
  # ---- etapa-producto ------------------------------------------------------
  - description: "etapa-producto / OVULOS_PURITY — veredicto APTO/NO APTO + score 0-1"
    vars:
      content: file://fixtures/etapa-producto/OVULOS_PURITY.txt
    assert:
      - type: python
        value: file://asserts/etapa-producto.py
    metadata: {etapa: etapa-producto, producto: OVULOS_PURITY}

  # ---- etapa-1 (costeo) ------------------------------------------------------
  - description: "etapa-1 / CLEARSTEM — costeo derivado, nunca inventado"
    vars: {content: file://fixtures/etapa-1/CLEARSTEM.txt}
    assert: [{type: python, value: file://asserts/etapa-1.py}]
    metadata: {etapa: etapa-1, producto: CLEARSTEM}
  - description: "etapa-1 / NusavaB12 — costeo derivado, nunca inventado"
    vars: {content: file://fixtures/etapa-1/NusavaB12.txt}
    assert: [{type: python, value: file://asserts/etapa-1.py}]
    metadata: {etapa: etapa-1, producto: NusavaB12}
  - description: "etapa-1 / TINNIDROP — costeo derivado, nunca inventado"
    vars: {content: file://fixtures/etapa-1/TINNIDROP.txt}
    assert: [{type: python, value: file://asserts/etapa-1.py}]
    metadata: {etapa: etapa-1, producto: TINNIDROP}
  - description: "etapa-1 / OVULOS_PURITY — CPA aún no derivable, declarado PENDIENTE (no inventado)"
    vars: {content: file://fixtures/etapa-1/OVULOS_PURITY.txt}
    assert: [{type: python, value: file://asserts/etapa-1.py}]
    metadata: {etapa: etapa-1, producto: OVULOS_PURITY}

  # ---- etapa-1b (componentes + voz del cliente) ------------------------------
  - description: "etapa-1b / NusavaB12 — sin claim de cura no marcada"
    vars: {content: file://fixtures/etapa-1b/NusavaB12.txt}
    assert: [{type: python, value: file://asserts/etapa-1b.py}]
    metadata: {etapa: etapa-1b, producto: NusavaB12}
  - description: "etapa-1b / TINNIDROP — nota de compliance 'nunca cura/elimina' está marcada como prohibición"
    vars: {content: file://fixtures/etapa-1b/TINNIDROP.txt}
    assert: [{type: python, value: file://asserts/etapa-1b.py}]
    metadata: {etapa: etapa-1b, producto: TINNIDROP}
  - description: "etapa-1b / OVULOS_PURITY — voz del cliente citada, cada cita con fuente"
    vars: {content: file://fixtures/etapa-1b/OVULOS_PURITY.txt}
    assert: [{type: python, value: file://asserts/etapa-1b.py}]
    metadata: {etapa: etapa-1b, producto: OVULOS_PURITY}

  # ---- etapa-2 (6 fichas de ángulo) ------------------------------------------
  - description: "etapa-2 / CLEARSTEM — 6 ángulos con nivel de conciencia"
    vars: {content: file://fixtures/etapa-2/CLEARSTEM.txt}
    assert: [{type: python, value: file://asserts/etapa-2.py}]
    metadata: {etapa: etapa-2, producto: CLEARSTEM}
  - description: "etapa-2 / NusavaB12 — 6 ángulos con nivel de conciencia"
    vars: {content: file://fixtures/etapa-2/NusavaB12.txt}
    assert: [{type: python, value: file://asserts/etapa-2.py}]
    metadata: {etapa: etapa-2, producto: NusavaB12}
  - description: "etapa-2 / OVULOS_PURITY — 6 ángulos con nivel de conciencia"
    vars: {content: file://fixtures/etapa-2/OVULOS_PURITY.txt}
    assert: [{type: python, value: file://asserts/etapa-2.py}]
    metadata: {etapa: etapa-2, producto: OVULOS_PURITY}

  # ---- etapa-fanpage (retargeted T1 p2-simplificacion: el juicio hoy vive en etapa-2, ver evals/README.md) ----
  - description: "etapa-fanpage / CLEARSTEM — página asignada existe en el catálogo de 10 (hoy PRODUCTOS/_DIM_FANPAGES.csv)"
    vars: {content: file://fixtures/etapa-fanpage/CLEARSTEM.txt}
    assert: [{type: python, value: file://asserts/etapa-fanpage.py}]
    metadata: {etapa: etapa-fanpage, producto: CLEARSTEM}

  # ---- etapa-6 (_PLAN.json) ---------------------------------------------------
  - description: "etapa-6 / CLEARSTEM — esquema _PLAN.json"
    vars: {content: file://fixtures/etapa-6/CLEARSTEM.json}
    assert: [{type: python, value: file://asserts/etapa-6_schema.py}]
    metadata: {etapa: etapa-6, producto: CLEARSTEM}
  - description: "etapa-6 / NusavaB12 — esquema _PLAN.json"
    vars: {content: file://fixtures/etapa-6/NusavaB12.json}
    assert: [{type: python, value: file://asserts/etapa-6_schema.py}]
    metadata: {etapa: etapa-6, producto: NusavaB12}
  - description: "etapa-6 / TINNIDROP — esquema _PLAN.json"
    vars: {content: file://fixtures/etapa-6/TINNIDROP.json}
    assert: [{type: python, value: file://asserts/etapa-6_schema.py}]
    metadata: {etapa: etapa-6, producto: TINNIDROP}
  - description: "etapa-6 / OVULOS_PURITY — esquema _PLAN.json"
    vars: {content: file://fixtures/etapa-6/OVULOS_PURITY.json}
    assert: [{type: python, value: file://asserts/etapa-6_schema.py}]
    metadata: {etapa: etapa-6, producto: OVULOS_PURITY}

  - description: "etapa-6 / OVULOS_PURITY — FASE 1 todo-en-imagen"
    vars: {content: file://fixtures/etapa-6/OVULOS_PURITY.json}
    assert: [{type: python, value: file://asserts/etapa-6_formato_imagen.py}]
    metadata: {etapa: etapa-6, producto: OVULOS_PURITY}

  # ---- etapa-5 (bot LucidBot) ---------------------------------------------------
  - description: "etapa-5 / CLEARSTEM — bloques obligatorios, voseo, sin claims prohibidas"
    vars: {content: file://fixtures/etapa-5/CLEARSTEM.md}
    assert: [{type: python, value: file://asserts/etapa-5.py}]
    metadata: {etapa: etapa-5, producto: CLEARSTEM}
  - description: "etapa-5 / TINNIDROP — bloques obligatorios, voseo, sin claims prohibidas"
    vars: {content: file://fixtures/etapa-5/TINNIDROP.md}
    assert: [{type: python, value: file://asserts/etapa-5.py}]
    metadata: {etapa: etapa-5, producto: TINNIDROP}

  # ---- etapa-8 (plan de escalado, histórico — la etapa hoy es etapa-7) ------------
  - description: "etapa-8 / TINNIDROP — Break-Even, regla de oro, surfing, ganadores con evidencia"
    vars: {content: file://fixtures/etapa-8/TINNIDROP.txt}
    assert: [{type: python, value: file://asserts/etapa-8.py}]
    metadata: {etapa: etapa-8, producto: TINNIDROP}

  # ---- etapa-4 (copy FASE 1, 6 conjuntos) ------------------------------------
  - description: "etapa-4 / TINNIDROP — 3 TEXTO + 3 TÍTULOS + DESCRIPCIÓN por conjunto, CTA a WhatsApp, sin palabras que banean"
    vars: {content: file://fixtures/etapa-4/TINNIDROP.txt}
    assert: [{type: python, value: file://asserts/etapa-4.py}]
    metadata:
      etapa: etapa-4
      producto: TINNIDROP
      expected_fail: true
      reason: >-
        Uno de los 3 TÍTULOS del conjunto "ME DIJERON QUE NO TIENE CURA" es
        literalmente "¿Te dijeron que no hay cura?" — usa la palabra "cura",
        que DOCTRINA/COPYWRITING_ADS.md §PRINCIPIO 7 lista para evitar, aunque
        sea una pregunta retórica citando la objeción del cliente y no un
        claim afirmativo del producto. Output real (presente desde la línea
        base 02-sep-2026), nunca corregido porque hoy no hay ningún chequeo
        automatizado de compliance de copy — este assert es el primero. No se
        reescribe el fixture ni se relaja el assert: el hallazgo queda
        documentado para que quien toque ETAPA-4.md decida si el título se
        corrige.

  # ---- etapa-7 (monitor diario) -----------------------------------------------
  - description: "etapa-7 / TINNIDROP — CPA citado sin ROAS, integridad, sangrado y lectura por dimensión"
    vars: {content: file://fixtures/etapa-7/TINNIDROP.txt}
    assert: [{type: python, value: file://asserts/etapa-7.py}]
    metadata: {etapa: etapa-7, producto: TINNIDROP}

  # ---- etapa-7 FUSIONADA (monitor + plan de escalado en un solo output) --------
  # Un solo output real de la etapa fusionada, chequeado contra AMBOS contratos:
  # monitor (asserts/etapa-7.py) y plan de escalado (asserts/etapa-8.py).
  # Fuente: fixtures/etapa-7/SOURCE_FUSIONADO.txt.
  - description: "etapa-7 fusionada / TINNIDROP — un solo output cumple el contrato de monitor Y de plan de escalado"
    vars: {content: file://fixtures/etapa-7/TINNIDROP_FUSIONADO.txt}
    assert:
      - {type: python, value: file://asserts/etapa-7.py}
      - {type: python, value: file://asserts/etapa-8.py}
    metadata: {etapa: etapa-7, producto: TINNIDROP}

  # ---- etapa-9 (fábrica de conceptos — tanda registrada en _DIM_CREATIVOS.csv) -
  - description: "etapa-9 / TINNIDROP — tanda real: canonico_id completo, balance de embudo, máx 2 por concepto"
    vars: {content: file://fixtures/etapa-9/TINNIDROP.csv}
    assert: [{type: python, value: file://asserts/etapa-9.py}]
    metadata: {etapa: etapa-9, producto: TINNIDROP}

  # ---- etapa-guardar-producto (invariante 8: archivos por rol) -------------------
  - description: "etapa-guardar-producto / CLEARSTEM — solo archivos por rol declarados"
    vars: {content: file://fixtures/etapa-guardar-producto/CLEARSTEM.json}
    assert: [{type: python, value: file://asserts/etapa-guardar-producto.py}]
    metadata: {etapa: etapa-guardar-producto, producto: CLEARSTEM}
  - description: "etapa-guardar-producto / NusavaB12 — solo archivos por rol declarados"
    vars: {content: file://fixtures/etapa-guardar-producto/NusavaB12.json}
    assert: [{type: python, value: file://asserts/etapa-guardar-producto.py}]
    metadata: {etapa: etapa-guardar-producto, producto: NusavaB12}
  - description: "etapa-guardar-producto / TINNIDROP — solo archivos por rol declarados"
    vars: {content: file://fixtures/etapa-guardar-producto/TINNIDROP.json}
    assert: [{type: python, value: file://asserts/etapa-guardar-producto.py}]
    metadata: {etapa: etapa-guardar-producto, producto: TINNIDROP}
  - description: "etapa-guardar-producto / OVULOS_PURITY — solo archivos por rol declarados"
    vars: {content: file://fixtures/etapa-guardar-producto/OVULOS_PURITY.json}
    assert: [{type: python, value: file://asserts/etapa-guardar-producto.py}]
    metadata: {etapa: etapa-guardar-producto, producto: OVULOS_PURITY}
