\r
## OUTPUT\r
\r
```\r
══════════════════════════════════════════════════════\r
LECTURA CONCEPTO ↔ MÉTRICA — [PRODUCTO] · [VENTANA]\r
══════════════════════════════════════════════════════\r
COBERTURA DEL JOIN: [XX %] del gasto cruza con _DIM_CREATIVOS\r
  [si <80 % → SE DETIENE ACÁ y se reporta la brecha]\r
EXCLUIDOS POR SIN_ENTREGA: [n] anuncios · [Q] de gasto\r
\r
1. RANKING DE CONCEPTOS (con replicación)     → tabla\r
2. DESCOMPOSICIÓN POR ATRIBUTO (con piso)     → tabla + qué es señal y qué acumula\r
3. LECTURA POR ROL DE EMBUDO                  → cada rol con su métrica\r
4. MATRIZ ÁNGULO × CONCEPTO                   → qué viaja y qué es de contexto\r
5. BRIEF PARA etapa-9                         → explotar / explorar / no repetir\r
6. APRENDIZAJES NUEVOS                        → filas propuestas para _APRENDIZAJES.csv\r
══════════════════════════════════════════════════════\r
```\r
\r
---\r
\r
## REGLAS\r
\r
1. **Piso de evidencia antes de afirmar.** ≥5 ventas y ≥2 creativos distintos por nivel; sin\r
   solape de intervalos de Poisson. Lo demás es "acumulando".\r
2. **`SIN_ENTREGA` se excluye, nunca se cuenta como perdedor.**\r
3. **CPA semanal, nunca diario.** Ventana mínima de 7 días.\r
4. **Cada rol de embudo con su métrica.** Prohibido rankear TOFU contra BOFU por CPA.\r
5. **El concepto se lee dentro de su ángulo.** Comparar conceptos entre ángulos distintos sin\r
   decirlo mezcla las dos variables que todo el rediseño separó.\r
6. **La conversación corta, no corona** (APR-002). También acá.\r
7. **Sin `canonico_id` no hay lectura.** Las piezas sin él se reportan como deuda de registro.\r
8. **Solo lectura sobre Meta.** Recomienda; no ejecuta.\r
9. **Un aprendizaje nuevo entra a `_APRENDIZAJES.csv` con su `n` y su ventana.** Sin la muestra\r
   escrita al lado, el aprendizaje no se puede revisar después ni pesar contra la doctrina de los\r
   mentores (nivel 4 de la precedencia en `_CONOCIMIENTO/MATRIZ_METODOLOGIA.md`).\r
\r
---\r
\r
