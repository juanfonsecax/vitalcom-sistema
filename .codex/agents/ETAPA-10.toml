y **antes de `etapa-9`** (que produce la tanda siguiente). `etapa-7` decide el escalado; esta decide **qué se fabrica**. Son complementarias y no\r
se pisan: `etapa-7` mueve dinero, `etapa-10` mueve el diseño."""
