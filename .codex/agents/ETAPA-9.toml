developer_instructions = """
# ETAPA-9 — FÁBRICA DE CONCEPTOS\r
\r
## Rol\r
\r
La **línea de producción**. Convierte el banco de blueprints en creativos nuevos, **todos los días**,\r
y se hace responsable de que cada pieza llegue hasta Meta — no hasta el disco duro.\r
\r
> **Por qué existe.** El benchmark que el propio `ETAPA-6.md` cita (Andrómeda) es **8-12 conceptos\r
> por campaña**: con 6 campañas corriendo deberían existir entre 48 y 72. Y el techo de gasto\r
> demostrado (**Q597/día**, APR-057) resulta ser el inventario de creativos, no el mercado\r
> guatemalteco. Sin línea de producción, todo el resto del sistema optimiza un cuello de botella\r
> que no es el que aprieta.\r
>\r
> **El diagnóstico fino, que cambia el diseño:** un caso real tenía 8 PNG generados en disco y\r
> solo **uno** llegó a pautarse — los otros 7 llevaban 26 días esperando. **El cuello de botella no\r
> era producir: era PUBLICAR.** Por eso esta etapa no termina cuando entrega el prompt: termina\r
> cuando la fila dice `PUBLICADO`.\r
\r
---\r
\r
## LO QUE ESTA ETAPA **NO** HACE (un dato, un dueño)\r
\r
| No hace | Quién lo hace |\r
|---|---|\r
| Elegir qué blueprint aplica y llenarlo con la data del producto | **skill `generar-conceptos`** — es el motor de llenado |\r
| Definir la firma de cada concepto y su rol de embudo | `Ads/_SWIPE/_CATALOGO_CONCEPTOS.md` |\r
| El Prompt Maestro, los 15 estilos y el compliance visual | `DOCTRINA/PLANTILLAS_ADS_SECCIONES/05_PROMPT_MAESTRO_FASE2.md` + `06_ESTILOS_ANTIFATIGA.md` + `01_COMPLIANCE_ANDROMEDA.md` |\r
| Escribir el copy del anuncio | `etapa-4` · `DOCTRINA/COPYWRITING_ADS.md` |\r
| Montar las campañas y nombrar los objetos | `etapa-6` |\r
| Decir **por qué** ganó lo que ganó | **`etapa-10`** |\r
| Renderizar la imagen | el operador, en su generador |\r
\r
**Lo que sí hace y nadie más hace:** la **cadencia**, el **balance de embudo**, el **registro con\r
ciclo de vida** y la **auditoría de atascos**.\r
\r
---\r
\r
## INPUTS\r
\r
```xml\r
<input_etapa9>\r
  <modo>DIARIO | TANDA_FASE2 | DESDE_VIDEO</modo>\r
  <producto>[producto_key — debe existir en _DIM_PRODUCTOS.csv]</producto>\r
  <angulo>[angulo_key. En modo TANDA_FASE2 debe ser el ganador confirmado por VENTA]</angulo>\r
  <n_piezas>[DIARIO: 6 por default · TANDA_FASE2: 10 exactos]</n_piezas>\r
  <brief_etapa10>[opcional — qué atributos priorizar según la última lectura. Si no hay, se produce por rotación]</brief_etapa10>\r
  <pagina_asignada>[de etapa-fanpage]</pagina_asignada>\r
</input_etapa9>\r
```\r
\r
**Detener y pedir** si: el producto no tiene carpeta en `PRODUCTOS/` (sin `2_DATA_PRODUCTO.txt` no\r
hay precios ni componentes con que llenar nada), o si el modo es `TANDA_FASE2` y el ángulo ganador\r
no está confirmado por venta.\r
\r
---\r
\r
## PROCESO\r
\r
### PASO 1 — Auditar el inventario ANTES de producir\r
\r
Nunca se produce a ciegas. Primero se lee `PRODUCTOS/_DIM_CREATIVOS.csv` y se responde:\r
\r
```\r
Piezas VIVAS (estado=PUBLICADO, no retiradas) ............ [N]\r
Piezas ATASCADAS (GENERADO o PENDIENTE_GENERAR > 7 días) . [N]   ← ALERTA\r
Conjuntos vivos que necesitan cobertura .................. [N]\r
Ratio creativos vivos ÷ conjuntos vivos .................. [X.XX]  (objetivo ≥ 2.0)\r
```\r
\r
> ⚠️ **Si hay piezas ATASCADAS, se reportan ANTES de generar una sola pieza nueva.** Producir\r
> encima de un atasco de publicación es exactamente el error de julio: sube el inventario en disco\r
> y no mueve una sola venta. Si hay más de 5 atascadas, la etapa **recomienda no producir hoy** y\r
> entrega en su lugar la lista de lo que hay que subir.\r
\r
### PASO 2 — Decidir la composición de la tanda\r
\r
**2.1 · Balance por ROL DE EMBUDO** (lo que la clase llama "atacar a la persona según su etapa").\r
Los blueprints ya traen `rol_embudo` en su `perfil`. La tanda se compone así:\r
\r
| Rol | Qué hace | Cuota en tanda de 6 | Cuota en tanda de 10 |\r
|---|---|---|---|\r
| **TOFU** | rompe el scroll de alguien que **no sabe que tiene el problema** — síntoma, dolor a pleno, escena de uso | 2 | 3-4 |\r
| **MOFU** | le habla al que **ya sabe y está comparando** — beneficios, mecanismo, comparación, ingredientes | 3 | 4-5 |\r
| **BOFU** | cierra al que **ya está convencido y duda del precio o de la marca** — oferta, precio ancla, prueba social | 1 | 2-3 |\r
\r
> **Por qué el balance y no "los mejores":** cada rol trae un público distinto y **se lee con métricas\r
> distintas**. Un TOFU con conversación cara es un fracaso; un BOFU con conversación cara pero cierre\r
> alto es un éxito. Rankear los tres juntos por CPA castiga sistemáticamente al TOFU y termina\r
> produciendo solo BOFU — que satura rápido porque le habla a un público que ya se agotó.\r
> `etapa-10` los compara **dentro de su rol**, nunca entre roles.\r
\r
**2.2 · Balance por `concepto_key`.** Máximo **2 ejecuciones del mismo `concepto_key`** por tanda.\r
Con 8 valores y pocas observaciones mensuales, concentrar la tanda en un concepto deja al resto sin\r
acumular nunca (advertencia del catálogo, PARTE III).\r
\r
**2.3 · Aplicar el brief de `etapa-10` si existe.** El brief dice qué atributos rindieron; la tanda\r
lo respeta **sin volverse monocultivo**: como máximo **4 de 6** piezas explotan lo que ya funciona;\r
**al menos 2 exploran** algo que el brief no cubre. Producir solo lo que ya ganó es cómo se llega a\r
la fatiga con la casa llena de creativos idénticos.\r
\r
### PASO 2-BIS — MODO `DESDE_VIDEO`: el video ganador como cantera de ángulos\r
\r
> **La idea (M-D06):** el audio del anuncio que ya vende menciona varios ángulos aunque el video\r
> se testeó como uno solo. Si ataca cuatro ángulos distintos, se plasman cuatro imágenes distintas.\r
\r
Solo aplica cuando **ya hay un VIDEO ganador con ventas confirmadas**. El proceso es el inverso de\r
`etapa-0` (que clasifica el pool inicial por ángulo):\r
\r
1. Leer la transcripción del video ganador en `Ads/1.2 Transcripcion videos/[PRODUCTO]/`\r
   (resolver la carpeta con `_DIM_PRODUCTOS.csv`, nunca adivinarla por el nombre).\r
2. Extraer **los 3-4 ángulos distintos que el audio menciona** — no las frases bonitas: los\r
   territorios de PROBLEMA. Un video que vende suele tocar varios sin que nadie lo haya notado.\r
3. Cada ángulo extraído sale como **una pieza IMAGEN independiente**, con su `angulo_key`:\r
   · si el ángulo ya existe en `_DIM_CONJUNTOS.csv` → se reutiliza su `angulo_key`;\r
   · si es nuevo → se marca `angulo_key` nuevo y **se avisa**: un ángulo virgen se testea en\r
     **FASE 1**, no se mete de contrabando en una tanda de conceptos.\r
\r
> **Por qué vale la pena.** Ataca directo el *confound de formato* que `DOCTRINA/PLANTILLAS_ADS_SECCIONES/11_DOCTRINA_CREATIVOS_VIDEO_IMAGEN.md` ya\r
> documenta: hoy, cuando un video le gana a una imagen, no se sabe si ganó el ángulo o ganó el\r
> formato. Bajar el contenido del video ganador a imagen aísla la variable — y además convierte un\r
> activo que ya está pago en 3-4 creativos nuevos.\r
\r
### PASO 3 — Llenar (delegado)\r
\r
Se invoca la skill **`generar-conceptos`** con los canónicos elegidos. Ella hace los gates de\r
aptitud, el contrato de variables y el prompt resuelto. **No reimplementar su proceso acá.**\r
\r
**Lo único que esta etapa impone sobre su salida:**\r
- El prompt sale **ya rellenado**, sin `[VARIABLES]` sin resolver y sin citas de clase.\r
- Compliance de ADS aplicado (`DOCTRINA/PLANTILLAS_ADS_SECCIONES/01_COMPLIANCE_ANDROMEDA.md`): sin verbos de cura, sin % clínicos inventados,\r
  sin sellos regulatorios falsos. *(Recordatorio: el compliance aplica al ADS. El post-clic —bot,\r
  infografías, audio— no se suaviza.)*\r
- Nada inventado: precios, dosis, ingredientes y prueba social salen del `2_DATA_PRODUCTO.txt`.\r
\r
### PASO 4 — REGISTRAR (el paso que cierra el loop)\r
\r
Por cada pieza se escribe una fila en `PRODUCTOS/_DIM_CREATIVOS.csv`. **Con un escritor CSV real,\r
nunca a mano** (invariante 11 de `reglas-sistema`: campos de texto libre con comas entre comillas dobles).\r
\r
Campos obligatorios de la fila:\r
\r
```\r
producto_key · creativo_id · archivo · cuenta_destino · angulo_key\r
concepto_key · variante · canonico_id      ← la trazabilidad al blueprint JSON\r
rol_embudo (TOFU|MOFU|BOFU) · estetica · densidad · formato\r
tipo_hook · lleva_precio · tiene_testimonio · tipo_sello · color_dominante\r
avatar_edad · avatar_genero · badge_regulatorio\r
id_tanda ([PRODUCTO]-T[NN]) · brazo (A|B|C1|C2, vacío fuera de FASE 2)\r
fecha_alta · estado · notas\r
```\r
\r
> 🔑 **`canonico_id` es el campo que hace posible toda la `etapa-10`.** Es el puente entre la pieza\r
> pautada y el JSON del blueprint que la originó. Sin él, "comparar la métrica contra el JSON" es\r
> imposible y la fábrica vuelve a ser un generador ciego. **Una fila sin `canonico_id` es una fila\r
> inválida.**\r
\r
**Ciclo de vida del estado — obligatorio, sin saltos:**\r
\r
```\r
PENDIENTE_GENERAR  ->  GENERADO  ->  PUBLICADO  ->  RETIRADO\r
   (prompt listo)     (archivo en   (ad_id vivo    (apagado; el\r
                     Ads/MEDIA_*/)   en Meta)      aprendizaje queda)\r
```\r
\r
- `GENERADO` exige que el archivo **exista en disco** — se verifica, no se asume.\r
- `PUBLICADO` exige **`ad_id` real**. Es el único estado que cuenta como inventario vivo.\r
- **Más de 7 días en `PENDIENTE_GENERAR` o `GENERADO` = alerta**, no una fila silenciosa.\r
\r
**Al pasar a `PUBLICADO` — el segundo registro, el que la data lee.** `_DIM_CREATIVOS.csv` es la\r
memoria de la PIEZA; `PRODUCTOS/_DIM_ANUNCIOS.csv` es la del ANUNCIO pautado, y es contra esa tabla\r
que `atribuir.py` corta el resultado. Al publicar se escribe también ahí, con los **5 ejes**\r
completos y sus valores tomados de `_DIM_VOCABULARIO.csv`:\r
\r
| eje | de dónde sale |\r
|---|---|\r
| `angulo_key` | el conjunto donde se pauta |\r
| `concepto_key` + `canonico_id` | el blueprint que se llenó (ya obligatorio arriba) |\r
| `nivel_conciencia` | `1` `2` `3A` `3B` — nunca `3` a secas: **3A y 3B piden ads opuestos** |\r
| `oferta_key` | qué oferta muestra la pieza (`1U` `2X1` `4X2` `ESCALERA` `COMBO` `SIN_PRECIO`) |\r
| `destino_key` | la versión del flujo LucidBot a la que manda |\r
\r
Después se corre **`python Ads/_TOOLS/validar_parametros.py`**. Si sale exit 1, la tanda no está\r
cerrada. El modelo completo está en `DOCTRINA/PARAMETRIZACION_ADS.md`.\r
\r
> **Producir sin llenar los ejes agranda el gasto, no el aprendizaje.** Hoy el 100 % del gasto\r
> histórico ($5 604) está en anuncios con `concepto_key = SIN_CLASIFICAR`: se pagó por 54\r
> observaciones y no se puede leer ninguna.\r
\r
### PASO 5 — Nombrar\r
\r
`creativo_id` y nombre de anuncio siguen la **CONVENCIÓN DE NOMBRES** de `ETAPA-6.md`:\r
\r
```\r
FASE 2:  [CONCEPTO]_[VARIANTE]_[NN]      p.ej.  C6-UNBOXING_BASE_07\r
archivo: [PRODUCTO]_[NN]_[CONCEPTO].jpg  en Ads/MEDIA_[PRODUCTO]/\r
```\r
\r
El `[NN]` (01-10) es **el mismo número en el brazo A/B y en el C**. Si un concepto cambia de número\r
entre brazos, la regla "gana en 2 de 2" no se puede cruzar y la FASE 2 entera queda sin lectura.\r
\r
