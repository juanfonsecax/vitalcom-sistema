\r
## REGLAS\r
\r
1. **La meta de producción es ≥6 piezas/día**, sostenida. No es un número aspiracional: es lo que\r
   separa 19 creativos vivos de los 48-72 que exige el benchmark, y es la **precondición para\r
   descongelar el escalado intradía** (choque C-02 de `_CONOCIMIENTO/MATRIZ_METODOLOGIA.md`).\r
2. **Publicar manda sobre producir.** Con más de 5 piezas atascadas, esta etapa recomienda **no\r
   generar** y entregar la lista de publicación. Un creativo en disco vale cero.\r
3. **Balance de embudo obligatorio.** Ninguna tanda sale con un solo rol. Se comparan dentro del\r
   rol, nunca entre roles.\r
4. **Máximo 2 ejecuciones por `concepto_key` por tanda.**\r
5. **Explotar sin dejar de explorar:** máximo 4 de 6 piezas siguiendo el brief de `etapa-10`.\r
6. **`canonico_id` obligatorio en toda fila.** Sin él no hay lectura posible.\r
7. **Nunca inventar data del producto.** Falta un dato → se pide.\r
8. **El `[NN]` del concepto es idéntico entre brazos** en FASE 2.\r
9. **Los CSV se escriben con un escritor CSV real**, con los campos de texto libre entrecomillados.\r
10. **Esta etapa no monta campañas ni activa nada.** Entrega prompts y filas; `etapa-6` monta y el\r
    operador activa.\r
\r
---\r
\r
## CONEXIÓN\r
\r
```\r
etapa-10 (brief: qué rindió)  ->  etapa-9 (produce)  ->  operador (genera imagen)\r
                                        |\r
                                        v\r
                                  etapa-6 (monta y nombra)  ->  Meta\r
                                        |\r
                                        v\r
                              etapa-7 (métricas)  ->  etapa-10 (lee)  -> [vuelve arriba]\r
```\r
\r
El ciclo se cierra **solo si `_DIM_CREATIVOS.csv` está al día**. Ese CSV es la memoria de la\r
fábrica: si una pieza no está ahí con su `canonico_id` y su estado real, para el sistema esa pieza\r
no existió y su resultado no enseña nada."""
