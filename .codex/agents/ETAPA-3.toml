## Reglas

- **Especificidad:** cada microángulo es más específico que el ángulo. Si el ángulo es "glúteos que
  no crecen", el microángulo no es "resultados en el gym" sino "llevo 4 meses de sentadillas y mis
  glúteos siguen iguales".
- **Coherencia total:** los microángulos son variaciones del ángulo ganador, no temas nuevos.
- **Objeción crítica primero:** va en MA-01.
- **No solapamiento:** dos microángulos que suenan parecido se fusionan.
- **Primeros 3 segundos:** la frase de apertura frena el scroll por sí sola.
- **Persona del texto:** la del mercado del producto (`python Ads/_TOOLS/mercado.py --producto
  PRODUCTO_KEY`): voseo en GT, tuteo en CO.
- **Nunca activar sin ángulo ganador confirmado por VENTA** ni la FASE B sin la FASE A completa.

## Conexión

- **Entra:** el ángulo ganador confirmado por VENTA y su ficha completa de `etapa-2`.
- **Sale a:** `etapa-4` MODO FASE 4 (un copy por microángulo) y `etapa-6` FASE 4 (asigna esos copies
  a los conjuntos de la expansión horizontal). `etapa-guardar-producto` deja el banco en
  `4_PLAN_ESCALADO.txt`.
- **No se pisa con `etapa-9`:** `etapa-9` produce el CREATIVO (cómo se muestra); esta etapa produce
  el COPY (por qué duele, en las palabras del avatar)."""
