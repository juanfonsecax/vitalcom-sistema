\r
## Reglas\r
\r
- **Regla de 4 AM obligatoria:** Toda campaña nueva se programa para las 4 AM del día siguiente. Si se aprueba a mitad del día, WhatsApp quema el presupuesto en minutos y no optimiza. (Clase 6 — Mercy: 4 AM día siguiente)\r
- **Regla de presupuesto igual:** Mismo monto en todos los conjuntos **dentro de cada etapa** ($2.99 en ETAPA 1 · $5.98 en ETAPA 2 · legacy Q54 si es a mano) para no sesgar qué ángulo o microángulo gana por más presupuesto. (Clase 6 — Mercy: mismo presupuesto por conjunto). La subida a $5.98 se aplica a los 3 sobrevivientes **a la vez**, nunca a uno solo — si no, el que sube gana por dinero, no por ángulo.\r
- **Regla ABO en testeo:** Usar ABO (presupuesto por conjunto) durante testeo para controlar individual. CBO solo cuando ya hay un ganador claro. (Clase 6 — presupuesto a nivel conjunto)\r
- **Regla de coherencia ángulo-flujo en FASE 2:** Todos los conjuntos de escalado apuntan al mismo flujo LucidBot (el del ángulo ganador). Nunca mezclar conjuntos que apunten a flujos distintos. (Regla Mercy/Joaquín)\r
- **Regla del ángulo único por conjunto:** Cada conjunto debe tener un ángulo o microángulo diferente. Nunca duplicar el mismo copy/hook en dos conjuntos. (Clase 19 — Joaquín: conceptos/ángulos diferentes)\r
- **Regla de los 2 anuncios por conjunto:** Cada conjunto lleva **2 anuncios**, nunca 1. Hay dos\r
  variantes y la elección se declara explícitamente en el output:\r
  · **DUPLICADO (default histórico):** el mismo creativo dos veces. Mecanismo de Mercy en Clase 6\r
    ("darle opciones a Meta"); el sistema lo viene usando y el CPA baja. El porcentaje exacto NO\r
    aparece en las clases auditadas — no citar un número.\r
  · **DOS CONCEPTOS (variante en prueba desde 31-jul):** dos creativos conceptualmente distintos\r
    del MISMO ángulo. Mismo número de anuncios, mismo presupuesto, misma estructura — pero el doble\r
    de entradas de recuperación para Andromeda, que en 2026 rankea por creativo y no por audiencia\r
    (la calidad del creativo explica ~56% del resultado y el benchmark es 8-12 conceptos distintos\r
    por campaña; un duplicado no cuenta como concepto).\r
  Mientras el test no cierre, el default sigue siendo DUPLICADO. Ver el TEST DE DIVERSIDAD abajo.\r
- **Regla de no pausar por falta de video (DOCTRINA DE CREATIVOS):** Un ángulo cuyo creativo es IMAGEN (ad Prompt Maestro de ETAPA-4) lanza igual que uno con video. NUNCA dejar un conjunto pausado por no tener video — la imagen lo cubre. Marcar el formato de cada conjunto (VIDEO/IMAGEN), no pausarlo.\r
- **Regla de lectura del ganador (confound de formato):** Leer el resultado a nivel de ÁNGULO con las métricas de conversación. Si los 2 mejores ángulos quedan a <15% entre sí y difieren en formato (uno video, otro imagen), no declarar ganador aún: en FASE 2 probar el ángulo en un solo formato para aislar la variable. Un video validado es un creativo más fuerte que una imagen fría — tenerlo en cuenta al comparar.\r
- **Regla de precio (Guatemala — máx 3/6, ideal 2/6):** Máximo 3 conjuntos (idealmente 2) llevan precio P1u en copy + creativo visual. El resto sin precio en ninguno. Si un conjunto lleva precio, va en ambos (copy y creativo); si no, en ninguno. (Ajuste V5 — coherente con ETAPA-4.)\r
- **Regla de métricas de observación:** El primer día de testeo busca datos, no ventas. Meta está identificando quién conecta con cada ángulo. (Clase 2 — Joaquín: "el primer día no busco venta, busco DATA")\r
- **Regla del 20% matutino:** Subir el presupuesto de un conjunto rentable máximo +20% por día y SOLO en la mañana (hasta 9-10 AM). Tocarlo más tarde reinicia el aprendizaje y desoptimiza. (Clase 8, 11, 15)\r
- **Regla del escalado horizontal:** Para crecer en volumen no se infla el conjunto ganador — se replica horizontalmente (duplicar conjunto, más fanpages, más cuentas) usando el MISMO Post ID para acumular prueba social. (Clase 8, 11, 15)\r
- **Regla del Post ID:** Las réplicas del anuncio ganador usan "publicación existente" (mismo Post ID) para que likes/comentarios/reproducciones se acumulen en una sola publicación = más prueba social, menor CPM. Moderar comentarios antes de replicar. (Clase 11, 15)\r
  > Matiz de objetivo (Clase 15): en el TESTEO el objetivo es Tráfico (Mercy: "Interacción nunca me funcionó"). En el ESCALADO con Post ID, Joaquín en Clase 15 crea la campaña de réplica con objetivo **Interacción**. Este sistema mantiene Tráfico por defecto; usar Interacción para Post ID solo si el operador lo valida.\r
- **Regla de límite por fanpage:** Hasta ~250 anuncios activos por fanpage. Pasado ese punto, abrir nueva fanpage del mismo nicho/identidad. El ganador solo se replica en fanpages del mismo nicho. (Clase 15)\r
- **Regla de los dos modos de escalado:** El operador elige modo AGRESIVO (Mercy — duplicar y multicuenta rápido) o PROGRESIVO (Joaquín — +20% matutino y duplicar solo tras 2-3 días estables). No mezclar criterios a mitad del escalado. (Clase 8, 11, 15)\r
- **Regla de diversidad conceptual en FASE 2 (benchmark Andromeda):** La campaña de escalado sale con **8-12 conceptos conceptualmente distintos**, no 4. La infraestructura ya existe y está sin usar: `PLANTILLAS_ADS.md` tiene 15 estilos visuales y `PRODUCTOS/_DIM_CREATIVOS.csv` ya tiene el campo `bloque_concepto`. En FASE 2 el objetivo es VOLUMEN, no atribución, así que acá conviene la diversidad máxima (similarity score <40% entre conceptos; las cuentas que testean 20+ anuncios/mes reportan 65% más ROAS que las que testean <10).\r
  > ⚠️ **NO APLICA A FASE 1.** Los 6 conjuntos con 1 creativo cada uno son el instrumento de MEDICIÓN: si se meten 3 creativos por conjunto se pierde saber qué ángulo ganó. Andromeda premia diversidad, pero el objetivo de FASE 1 es aprender, no entregar barato. Sacrificar la atribución ahí sale más caro que el CPM que se ahorra.\r
- **TEST DE DIVERSIDAD CONCEPTUAL (abierto 2026-07-31, leer antes de cerrarlo):** TINNIDROP corre\r
  4 réplicas equivalentes (2🟦 CP1 · 3🟦 GTR1 · 4🟦 GTR7 · 5🟦) con los mismos ángulos, la misma\r
  página y el mismo presupuesto. Es un experimento natural que no cuesta pauta extra:\r
  · **CONTROL** — 2🟦 y 3🟦 se quedan con el duplicado (2 anuncios idénticos por conjunto).\r
  · **TRATAMIENTO** — 4🟦 y 5🟦 pasan a 2 conceptos DISTINTOS del mismo ángulo por conjunto.\r
  · No tocar presupuestos ni ángulos durante el test: la única variable que cambia es el 2º anuncio.\r
  · Leer a nivel de ÁNGULO (nunca por conjunto) cuando ambos brazos hayan cumplido su Presupuesto\r
    de Decisión (1 × break-even). Métrica de corte: CPA real por LucidSales. Secundaria: CPM y\r
    frecuencia (si la diversidad funciona, el CPM debería bajar y la frecuencia crecer más lento).\r
  · ⚠️ Con 4 réplicas y pocas ventas por celda esto NO da significancia estadística sola: es una\r
    señal direccional. Si el tratamiento gana ≥20% en CPA sostenido 2 ventanas, se cambia el default.\r
    Si queda a <15%, se declara empate y se mantiene el duplicado.\r
  · Registrar en `PRODUCTOS/_EVENTOS.csv` una fila `CAMBIO_CREATIVO` por cada réplica que se toque,\r
    con motivo "test diversidad conceptual brazo TRATAMIENTO" — si no, ETAPA-7 va a leer el cambio\r
    como si fuera el ángulo.\r
  · Al cerrarlo, escribir el resultado en `PRODUCTOS/_APRENDIZAJES.csv` (alcance GLOBAL) y actualizar\r
    esta regla y la de AGENTS.md nº 9.\r
