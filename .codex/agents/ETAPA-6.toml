# ETAPA-6 — PLANIFICADOR DE LANZAMIENTO\r
\r
## Rol\r
Produce la estructura de campaña lista para crear en Meta Ads. Opera en dos modos:\r
- **FASE 1 (Testeo):** 1 campaña con 6 ángulos distintos para identificar el ganador\r
- **FASE 2 (Escalado):** 1 campaña con 6 variaciones del ángulo ganador para maximizar ventas\r
\r
El operador solo necesita leer el output de este agente y replicarlo en Meta Ads.\r
\r
> **MODO MCP (automatizado) — recomendado.** Cuando el conector Meta Ads está disponible, ETAPA-6 NO se limita a texto: el orquestador crea la estructura **real en Meta, en estado PAUSED**, siguiendo `MCP_PLAYBOOK.md` (raíz del sistema). Resumen:\r
> - Campaña **Tráfico** (`OUTCOME_TRAFFIC`) + 6 conjuntos (**CONVERSATIONS / WHATSAPP**, ABO, **$2.99/conjunto = 299¢ USD** (ETAPA 1), amplio **18-65+** con Advantage+ OFF, programados **4 AM**, todo **PAUSED**). Nombres según la **CONVENCIÓN DE NOMBRES** de abajo (llave de ETAPA-7).\r
> - Los **ANUNCIOS** van en un **2º paso** (requieren media: el MCP no la sube). El operador sube los assets a la biblioteca de la cuenta y avisa; entonces se crean **2 anuncios/conjunto** con su copy (regla del duplicado interno). Precio P1u solo en los conjuntos marcados.\r
> - La carpeta `Ads/MEDIA_[PRODUCTO]/` con los videos renombrados por conjunto **ya existe desde antes** (la crea el orquestador justo después de ETAPA-0 — ver AGENTS.md PASO 1.5, independiente del MCP); acá solo se completa con `PROMPTS_IMAGENES_[PRODUCTO].txt` (ETAPA-4) para los ángulos-imagen, y se genera `PRODUCTOS/[NOMBRE]/3_CAMPAÑA_META.txt` con todos los IDs (campaign_id + 6 ad_set_id).\r
> - Pre-flight (cuenta `is_ads_mcp_enabled`+`is_queryable`, fanpage asignada a la cuenta con WhatsApp, IDs en `2_DATA_PRODUCTO.txt`), parámetros exactos, mapeo de campos y gotchas: ver **`MCP_PLAYBOOK.md`**.\r
> - El texto-estructura de abajo es el espejo legible del esqueleto y el **fallback** si no hay MCP. Presupuesto canónico = **$2.99/conjunto** (299¢ USD) para la ETAPA 1 del testeo; al día ~3 se cortan 2-3 conjuntos por conversación y los sobrevivientes suben a **$5.98** (ETAPA 2). Fórmula y aritmética en `CALENDARIO_ESCALADO.md` §1.5. El **$1.59** queda deprecado (no sacaba a Meta de aprendizaje). El **Q54** que aparezca abajo es el legacy pre-MCP (≈$7) y solo aplica si se pauta a mano sin MCP.\r
\r
---\r
\r
## CONVENCIÓN DE NOMBRES (dueño único — vale para MCP y para pauteo manual)\r
\r
> **Por qué existe (caso real 2026-08-01):** el operador tenía la campaña `4🟦 TINIDROP GTR0 - 1.59 - 4 WINERS` **viviendo en GTR 7**, no en GTR 0 — el nombre mentía sobre su propia cuenta. Y en una misma campaña convivían 4 conjuntos llamados `DETERIORO COGNITIVO - video - Copia`, indistinguibles entre sí en el CSV exportado. Sin identidad en el nombre, ni el operador ni ETAPA-7 pueden saber de qué cuenta, qué ángulo y qué réplica habla cada fila.\r
\r
**Los tres niveles:**\r
\r
```\r
CAMPAÑA:   [CUENTA]_[PRODUCTO]_[FASE]_[YYYYMMDD]\r
           GTR7_VARICOSE_ESCALA-VERGUENZA_20260802\r
           GTR0_TINNIDROP_TEST_20260802\r
\r
CONJUNTO:  [CUENTA]_[PRODUCTO]_[ANGULO]_R[N]\r
           GTR7_VARICOSE_MIEDO-CIRUGIA_R1\r
           GTR7_VARICOSE_MIEDO-CIRUGIA_R2      ← réplica horizontal del mismo ángulo\r
           GTR0_TINNIDROP_PERDIDA-AUDITIVA_R1\r
\r
ANUNCIO:   [ANGULO]_[FORMATO]_[A|B]\r
           MIEDO-CIRUGIA_VID_A  ·  MIEDO-CIRUGIA_VID_B\r
           PERDIDA-AUDITIVA_IMG_A\r
```\r
\r
**Reglas de formación (no negociables):**\r
1. **`CUENTA` = el alias de la cuenta publicitaria donde el objeto REALMENTE vive** (`GTR7`, `GTR0`, `GTR1`, `GTR3`, `GTR13`, `CP1`). Nunca el nombre de otra cuenta, aunque sea réplica de una campaña que nació allá.\r
2. **`ANGULO` = el `angulo_key`, idéntico entre réplicas y entre cuentas.** Es lo que permite agregar por ángulo (regla 6 de `AGENTS.md`). Si el mismo ángulo se llama distinto en dos cuentas, la agregación se parte y el ganador se declara sobre data incompleta.\r
3. **Separador de campos = `_`. Dentro de un campo solo guion medio (`-`).** Así el nombre se parte por `_` de forma determinista: `GTR7_VARICOSE_MIEDO-CIRUGIA_R1` → 4 campos exactos. Un `_` dentro del ángulo rompe el parseo.\r
4. **`R[N]`: R1 es el original, R2/R3/R4… los duplicados horizontales.** El número es obligatorio incluso cuando hay una sola réplica — un conjunto sin `R` es un conjunto que no se sabe si es original o copia.\r
5. **Prohibido dejar `- Copia`.** Meta lo agrega al duplicar; se renombra ANTES de publicar. Un `- Copia` publicado es data que nace anónima.\r
6. Sin emojis ni espacios en el nombre. Los emojis de estado (`🟩`/`🟦`) pueden ir **al final**, nunca entre los campos.\r
\r
**⚠️ Qué NO significa el `R[N]` — leer antes de podar réplicas:**\r
Las réplicas de un mismo ángulo son **idénticas por diseño** (mismo creativo, misma audiencia, mismo presupuesto). La diferencia de resultados entre `R1` y `R3` es **ruido de Poisson, no señal** — medido sobre data propia, el índice de dispersión por conjunto es 1.12 (azar casi puro) y solo sube a 2.99 al agregar por ángulo (regla 6 de `AGENTS.md`). Por lo tanto:\r
- Las réplicas **se suman**, no se comparan. El CPA del ángulo es el gasto total de R1+R2+R3 dividido por sus ventas totales.\r
- **Nunca coronar "la mejor copia"** ni apagar R2 para dejar R3: se está eligiendo ruido.\r
- El `R[N]` sirve para (a) identificar filas en el CSV, (b) sumarlas correctamente, y (c) detectar una réplica **rota** — entrega en cero, rechazada, o con creativo distinto al que debía. Eso sí es señal.\r
\r
