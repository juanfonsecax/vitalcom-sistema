ESCALADO HORIZONTAL — MULTICUENTA + POST ID (Clase 8, 11, 15)\r
──────────────────────────────────────────────────────\r
Cuando el ángulo ganador ya es rentable y se quiere crecer en volumen, NO inflar el mismo\r
conjunto. Se escala HORIZONTALMENTE: replicar el conjunto/anuncio ganador en más conjuntos,\r
más fanpages y más cuentas, manteniendo la prueba social acumulada.\r
\r
1) POST ID (publicación existente):\r
   - Lanzar cada réplica usando el MISMO Post ID del anuncio ganador (opción "Usar publicación\r
     existente"), no creando un anuncio nuevo desde cero.\r
   - Así todos los likes, comentarios y reproducciones se acumulan en una sola publicación →\r
     más prueba social = mayor CTR y menor CPM en cada réplica.\r
   - Antes de replicar, moderar comentarios del Post (ocultar negativos, responder dudas).\r
\r
2) DUPLICADO HORIZONTAL:\r
   - Duplicar el conjunto ganador 3-5 veces dentro de la campaña (mismo creativo, mismo Post ID).\r
   - Cada duplicado arranca con $2.99 (legacy Q54) y se sube máx +20% en la mañana (regla del 20% matutino).\r
\r
3) MULTICUENTA / MULTI-FANPAGE:\r
   - Replicar el ganador en otras cuentas publicitarias y fanpages del mismo nicho para diluir\r
     riesgo de baneo y ampliar alcance sin saturar una sola cuenta.\r
   - Límite operativo: hasta ~250 anuncios activos por fanpage. Pasado ese punto, abrir nueva\r
     fanpage del mismo nicho/identidad (ver SISTEMA DE FANPAGES).\r
   - Mantener coherencia de identidad: el ganador solo se replica en fanpages del mismo nicho.\r
\r
4) CUANDO META "SE ENAMORA" DE UN ANUNCIO (Clase 11 — Camilo):\r
   - Síntoma: Meta concentra casi todo el presupuesto en 1 anuncio y deja a los demás gastando\r
     muy poco → no sabés si esos otros eran buenos o malos.\r
   - Respuesta: DUPLICAR el conjunto completo. En el duplicado Meta reparte distinto ("ya vi ese\r
     en el mercado, me voy por otro") y los demás anuncios pueden rendir. El conjunto original\r
     queda intacto; el duplicado sube un poco los costos (normal). Se puede duplicar 8-10 veces.\r
\r
DOS MODOS DE ESCALADO (el operador elige según su tolerancia al riesgo):\r
- MODO AGRESIVO (Mercy): duplicar horizontal rápido y abrir multicuenta apenas hay rentabilidad.\r
  Más volumen, más rápido, mayor exposición a baneos.\r
- MODO PROGRESIVO / VALIDACIÓN (Joaquín): subir +20% matutino día a día y duplicar horizontal\r
  solo cuando el CPA se sostiene 2-3 días bajo el objetivo. Más lento, más estable.\r
