□ El precio P1u (Q[P1u]) aparece en máximo 3 de los 6 copies (ideal 2) — el resto va sin precio\r
□ Los conjuntos con precio lo llevan en copy Y en creativo visual; los sin precio, en ninguno\r
□ Cada conjunto tiene 2 anuncios (mismo creativo duplicado dentro del conjunto)\r
□ La campaña está programada para 4 AM mañana (no para hoy)\r
□ El presupuesto de todos los conjuntos es igual ($2.99 en MCP · o Q54 si es a mano) — igual DENTRO de cada etapa\r
□ El objetivo de campaña es Tráfico, destino WhatsApp, optimización "maximizar conversaciones" (nunca Interacción ni Ventas en el testeo — Mercy: Interacción nunca le funcionó)\r
\r
══════════════════════════════════════════════════════\r
FIN ESTRUCTURA ESCALADO\r
══════════════════════════════════════════════════════\r
