## Output\r
\r
```\r
ANÁLISIS DE COSTEO — [NOMBRE DEL PRODUCTO]\r
========================================\r
\r
DATOS BASE\r
Nombre del producto: [nombre]\r
Costo proveedor (Q): Q[costo]\r
Fila de tabla usada: costo más cercano Q[valor de tabla]\r
\r
PRECIOS DE VENTA\r
P1u — 1 unidad: Q[precio] + ENVÍO GRATIS\r
P2u — 2 unidades: Q[precio] + ENVÍO GRATIS ← OFERTA IRRESISTIBLE\r
P3u — 3 unidades: Q[precio] + ENVÍO GRATIS + regalo\r
\r
ARQUITECTURA DE OFERTA RECOMENDADA (Paso 2): [1/2/3 unidades | 2x1 | 4x2 | combo afín]\r
  Motivo: [piso por pedido / ticket / recompra-uso único / nivel de conciencia]\r
\r
UMBRALES DE CAMPAÑA (TOMADOS EXACTAMENTE DE la tabla está embebida en ETAPA-1)\r
CPA Objetivo:   Q[valor exacto de tabla]\r
CPA Break Even: Q[valor exacto de tabla]\r
\r
MARGEN ESTIMADO POR OPCIÓN\r
P1u: Q[precio] - Q[costo] - Q[CPA obj] = Q[margen] por pedido\r
P2u: Q[precio] - (Q[costo]×2) - Q[CPA obj] = Q[margen] por pedido\r
P3u: Q[precio] - (Q[costo]×3) - Q[CPA obj] = Q[margen] por pedido\r
```\r
\r
---\r
\r
## Reglas\r
\r
- **Regla de tabla exacta:** Los valores de CPA objetivo y CPA break even deben tomarse EXACTAMENTE de la tabla está embebida en ETAPA-1. (Flujo del sistema)\r
- **Regla de no inventar:** Nunca crear umbrales propios ni redondear los valores de la tabla.\r
- **Regla conservadora del CPA:** Siempre costear con el CPA objetivo de la tabla, no con el CPA real histórico, para no subestimar el costo.\r
- **Regla de arquitectura de oferta (matriz, Paso 2):** elegir la estructura (1/2/3 · 2x1 · 4x2 · combo) por el PISO por pedido, el ticket, recompra vs uso único y el nivel de conciencia — no a ojo. Bajo ticket → 2x1/4x2. Mercado GT: NO inflar el precio de 1u para anclar. (Mercy CLASE 17 + investigación web)\r
\r
---\r
\r
## Conexión\r
Output completo → ORCHESTRATOR → ETAPA-2 (como `output_etapa_1`)\r
Los valores P1u, P2u, P3u, CPA objetivo y CPA break even, y la ARQUITECTURA DE OFERTA (Paso 2), se usan también en ETAPA-5 (oferta del bot) y ETAPA-6 (estructura de campaña).\r
