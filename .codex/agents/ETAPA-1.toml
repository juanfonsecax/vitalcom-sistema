| Q40 | Q179 | Q30.8 | **Q71.6** | ~~Q60.5~~ | Q239 | Q299 |\r
| Q45 | Q189 | Q30.8 | **Q75.2** | ~~Q64.5~~ | Q249 | Q319 |\r
