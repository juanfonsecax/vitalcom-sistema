## GARANTÍA COMO PALANCA DE OFERTA (validada en landing, portada al bot)\r
Cuando el operador ofrece una garantía REAL, se usa como reductor de fricción Y como palanca de upsell escalonada por cantidad (probado en landing del operador):\r
- **Baseline** (todas las cantidades): X días de garantía de satisfacción → va en la INFOGRAFÍA 3 (confianza) como sello.\r
- **Escalera por cantidad** (empuja al combo, SOLO en el mensaje de oferta del bot, NUNCA en la imagen): 1u y 2u = X días · 3u = 2X días (ej. 90 / 180). El "más garantía" es otro motivo para llevar el tratamiento completo, encima del precio y el regalo.\r
- **Wording (COD)**: siempre "garantía de SATISFACCIÓN · acompañamiento del equipo", NUNCA "devolución del 100% del dinero" (en contraentrega el reembolso en efectivo es delicado y comprometerlo trae problemas).\r
- No poner precios ni cantidades en las infografías: cuando la persona ya está en el flujo, la imagen no vende cantidad — la escalera de garantía vive en el mensaje de oferta (INTERACCIÓN 2)."""
