| Q65 | Q209 | Q30.8 | **Q73.2** | ~~Q64.4~~ | Q319 | Q419 |\r
| Q70 | Q219 | Q31.3 | **Q76.9** | ~~Q68.3~~ | Q339 | Q449 |\r
