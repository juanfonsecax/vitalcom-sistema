\r
**Cómo se deriva el Break-Even (para que no se vuelva a estimar a ojo):**\r
```\r
CPA BREAK EVEN  = CPA BASE + UTILIDAD ESPERADA\r
UTILIDAD ESPERADA = (precio establecido − suma de costos) × (1 − % devoluciones)\r
SUMA DE COSTOS  = producto + envío + gastos + max(CPA objetivo, CPA mínimo, CPA real)\r
```\r
Parámetros vigentes (mercado GT): tasa de despacho **97%** · devoluciones **17%** · publicidad **20%** · utilidad esperada **20%** · costo de devolución **Q27** · inefectividad **19.5%** · USD→GTQ **7.64**.\r
\r
> El BE es, por definición, el CPA donde la ganancia queda en CERO (ya consume toda la utilidad esperada). No es un objetivo: es el techo.\r
\r
**Regla de aproximación:** la fila **más cercana** al costo; **en empate, la superior** (conservador). Lo aplica `costear.py`, no se hace a ojo. Casos reales: un producto con costo Q41 → fila Q40 · uno con Q55 → fila Q54 · uno con Q57 → empata entre Q54 y Q60 → fila Q60. **Nunca se interpola.**\r
\r
**Productos en COMBO (2x1 / 4x2):** el costo que entra a la tabla es el del PEDIDO COMPLETO, no el de la unidad. Ej. un producto que vende 2 frascos de Q45 → **producto Q90 → fila Q90** (precio Q249, BE Q83.0), no la fila Q45.\r
\r
⚠️ **La tasa de entrega real se verifica cada mes** contra `PRODUCTOS/_TASA_ENTREGA.csv`. Ojo al leerla: el % de "ENTREGADO" que muestra Dropi es sobre el TOTAL e incluye pedidos **en tránsito**. El % de devolución que importa se calcula sobre **estados RESUELTOS** (entregado + devolución + cancelado). Julio-2026: 85.1% de entrega / 14.0% de devolución sobre resueltos → el supuesto de 17% está bien calibrado.\r
\r
---\r
\r
### Paso 2 — Elegir la ARQUITECTURA DE OFERTA (matriz de decisión)\r
> La tabla da 1/2/3 unidades por defecto, pero la ESTRUCTURA de oferta se decide por estos parámetros (Mercy CLASE 17 + investigación web de unit economics COD). No elegir a ojo.\r
\r
**PASO 0 — Piso por pedido = (costo × u) + CPA Break Even + envío + comisión/RTO de COD.** La oferta elegida debe despejar ese piso con margen.\r
\r
1. **Bajo ticket — P1u NO despeja el piso (típico costo < ~Q50):** liderar con **2x1 / 4x2**, SIN ofrecer 1u suelta como entrada. El "2x1 / gratis" sube el AOV y rinde más que un descuento equivalente (los consumidores compran ~73% más con BOGO que con el % off equivalente; el "gratis" pesa más que "mitad de precio").\r
2. **Ticket medio/alto — P1u ya despeja el piso con margen:** usar **1/2/3 unidades**, con **3u = "la más elegida ⭐ + regalo"** (tratamiento completo) y **brecha CORTA entre 1u y 2u** (si la brecha es grande compran 1).\r
3. **Tipo de producto:** recompra/salud (suplementos) → 1/2/3 (tratamiento). Uso único / impulso (corrector, tenis, gadget) → **2x1, 4x2 o combos afines**, nunca forzar 3 unidades iguales.\r
4. **Nivel de conciencia del avatar:** Nivel 3 (conoce el producto pero teme comprar) → conviene mantener 1u para que pruebe, salvo que el ticket no lo permita; Nivel 1-2 con dolor fuerte → empujar 2-3 / 2x1.\r
5. **Mercado GT (regla del operador, confirmada por experiencia + research; en otro mercado se valida con su data antes de asumirla):** NO inflar el precio de 1u para "anclar" la de 2u — en chat de WhatsApp COD price-sensitive el precio se revela en secuencia y un 1u inflado ASUSTA en vez de anclar. Anclar con brecha corta + envío gratis + regalo en 3u, no con un 1u caro.\r
\r
> El resultado de esta matriz (1/2/3 · 2x1 · 4x2 · combo) lo consumen ETAPA-5 (presentación de la oferta en el bot) y ETAPA-6 (estructura de campaña).\r
\r
---\r
\r
### Paso 2.5 — REGLA DE ARRANQUE: ¿1 unidad o directo en 2x1? (aritmética del múltiplo)\r
\r
> Vale para TODO producto nuevo. **Este archivo es el dueño.** Es la versión numérica de la matriz del Paso 2: cuando el Paso 2 deja duda, esto la resuelve.\r
\r
Lo decide el **múltiplo del costo que habría que cobrar por UNA unidad**, no el margen — a cualquier costo el margen cierra. Los ~Q40 fijos de logística (flete Q34 + admin Q4 + otros Q2) **no bajan con el precio**, así que en un producto barato ese múltiplo se dispara y el precio deja de ser creíble para la categoría.\r
\r
```\r
P1u mínimo = (CPA peor + (1−TE) × costo devolución) / TE + costo + fijos\r
múltiplo   = P1u mínimo ÷ costo\r
```\r
\r
| Costo proveedor | Múltiplo necesario | Decisión |\r
|---|---|---|\r
| ≤ Q40 | ≥ 4× (Q30 necesita 4.6×, Q35 4.4×) | **Arrancar en 2x1.** No ofrecer 1u. |\r
| Q45–Q55 | 3.2–3.6× | **Zona de CRITERIO:** si la categoría tiene un ancla de precio conocida (crema, repelente, suplemento común), el 2x1 juega a favor; si no, 1u funciona. |\r
| ≥ Q60 | ≤ 3× | **1 unidad viable**, con 2u/3u/4u como upsell. |\r
\r
**Tabla maestra de precios** (costo Q30→Q130 en múltiplos de 5, con precio y break-even de cada escalón 1u/2u/3u/4u): se **GENERA en el dashboard** desde `PRODUCTOS/_DIM_COSTEO.csv` + `PRODUCTOS/_TASA_ENTREGA.csv`. Los precios de 1u son los que ya decidió el operador; solo Q30/Q35 se extrapolan.\r
\r
**Cada unidad extra se cobra a `costo unitario × 1.7` redondeado a la decena** — regla derivada de las escaleras que el operador ya usaba (costo Q60 → 199/299/399 · costo Q40 → 179/249/319/389).\r
\r
> ⚠️ Es sugerencia de **PRECIO**, no predicción de **CONVERSIÓN**: subir el precio puede bajar el cierre. Se testea.\r
