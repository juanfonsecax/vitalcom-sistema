developer_instructions = """
# ETAPA-1 — ANÁLISIS DE PRODUCTO Y COSTEO\r
\r
## Rol\r
Recibe el nombre del producto y su costo en la **moneda de su mercado** (`python Ads/_TOOLS/mercado.py\r
--producto PRODUCTO_KEY`: moneda, símbolo y persona salen de `PRODUCTOS/_DIM_MERCADOS.csv`),\r
**obtiene las cifras ejecutando `Ads/_TOOLS/costear.py`** y aplica sobre ellas la matriz de arquitectura\r
de oferta. `costear.py` y las tablas de abajo son las del mercado **GT** (Quetzales); un producto de otro\r
mercado no se costea con ellas: se detiene y se pide su tabla (`_DIM_COSTEO.csv` no la trae todavía).\r
Las cifras en `Q` de este archivo son las de GT. Las cifras no\r
se leen a ojo de una tabla ni se calculan de cabeza: salen del script o no salen.\r
\r
---\r
\r
## Input\r
```xml\r
<input>\r
  <nombre_producto>[nombre exacto del producto]</nombre_producto>\r
  <costo_proveedor_q>[costo en la moneda del mercado del producto]</costo_proveedor_q>\r
</input>\r
```\r
\r
---\r
\r
## Proceso interno\r
\r
### Paso 0 — OBLIGATORIO: ejecutar el script de costeo\r
\r
```bash\r
python Ads/_TOOLS/costear.py [COSTO_DEL_PEDIDO] --json\r
```\r
\r
Devuelve fila usada, P1u, escalera 1..n, CPA objetivo, CPA base, CPA break-even y la decisión de\r
arranque (1u vs 2x1). **Esas son las cifras del output: no se recalculan, no se redondean, no se\r
completan de memoria.** Si el script falla o alerta de techo de tabla excedido (exit 1), detener y\r
reportar — no estimar.\r
\r
> En productos COMBO (2x1, 4x2) el costo que entra es el del **PEDIDO COMPLETO**, no el de la\r
> unidad: un producto que vende 2 frascos de Q45 → se pasa `90`, no `45`.\r
\r
Lo que el script **no** decide y sigue siendo trabajo de esta etapa: la **arquitectura de oferta**\r
(Paso 2) según tipo de producto y nivel de conciencia del avatar, y la lectura de la tabla de abajo\r
cuando hace falta explicar de dónde viene un número.\r
\r
### Paso 1 — La tabla de referencia (espejo legible, no fuente)\r
\r
> **UNA SOLA ESCALERA.** La fuente única es\r
> `PRODUCTOS/_DIM_COSTEO.csv`, columnas `precio_establecido`, `precio_2u`, `precio_3u` y\r
> `origen_escalera`. La tabla de abajo es su espejo legible: **si difiere del output de\r
> `costear.py`, manda el script.**\r
>\r
> Antes había dos escaleras en circulación: esta tabla y la regla `costo × 1.7` del código.\r
> `_DIM_PRECIOS.csv` las desempató con datos de Dropi — TINNIDROP en la fila Q40 vende a\r
> **179/239/299 con n=102/42/18 órdenes reales**, que es esta tabla; la regla habría dado\r
> 179/249/319. La regla quedó solo para **extrapolar** los costos Q85-Q130 que el operador nunca\r
> fijó, y esas filas salen marcadas `EXTRAPOLADO`: hay que confirmarlas antes de publicarlas.\r
\r
**JERARQUÍA DE PRECIOS — cuál manda cuando dos fuentes discrepan:**\r
\r
| Prioridad | Fuente | Cuándo aplica |\r
|---|---|---|\r
| 1 | `PRODUCTOS/_DIM_PRECIOS.csv` | Producto **ya vendiendo**. Es lo que Dropi cobra de verdad. *Manda Dropi* — el archivo del producto decía Q299 para CLEARSTEM 2x y Dropi confirmó Q289. |\r
| 2 | `PRODUCTOS/_DIM_COSTEO.csv` vía `costear.py` | Producto **nuevo**, sin ventas todavía. |\r
| 3 | La tabla de abajo | Solo lectura humana. Nunca se copia a mano a un archivo de producto. |\r
\r
**Regla de selección de fila:** la **más cercana** al costo; en empate, la superior. Un producto con costo Q41 →\r
fila Q40 · uno con Q55 → fila Q54 · uno con Q57 → empata (54 y 60) → fila Q60. Nunca se interpola.\r
\r
# COSTEO_COMPLETO_VITALCOM — Tabla Maestra (v2)\r
\r
> **Fuente:** `COSTEOS GT PRO.xlsx` del operador. La tabla completa con TODAS las columnas intermedias (envío, gastos, utilidad, % de ingreso) está en **`PRODUCTOS/_DIM_COSTEO.csv`** — de ahí la lee el dashboard. Acá va el resumen operativo.\r
>\r
> **Qué cambió vs v1:** los **precios y el CPA Base NO cambiaron**. El **Break-Even subió 11-18%** porque ahora se calcula explícito en vez de estimarse. La tabla además **se extiende de Q80 hasta Q130**.\r
\r
