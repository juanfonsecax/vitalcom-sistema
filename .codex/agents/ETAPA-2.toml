## ASIGNACIÓN DE FANPAGE

Leer `PRODUCTOS/_DIM_FANPAGES.csv` (10 filas: `pagina_num, pagina_nombre, identidad, rol, tono,
logica, edad_orientacion, page_id, productos_nicho`). Nunca inventar una página ni copiar sus datos
de memoria.

- **F1 — Comprador principal:** se asigna por quién COMPRA el producto, no por el ingrediente ni por
  la condición. Un magnesio para dormir va a la página de sueño y estrés, no a una de minerales.
- **F2 — Doble audiencia:** si aplica para 2 páginas, la de mayor audiencia estimada.
- **F3 — Sin página ideal:** si no encaja claramente en ninguna, **no se asigna por descarte**: se
  entrega el Formato B y el orquestador alerta al operador antes de seguir (crear la página antes de
  lanzar).
- **F4 — Tono por identidad:** doctora en tema sensible → educativo primero, nunca vendedor · persona
  que lo vivió → historia personal antes del producto · coach → resultado visual + método.
- **F5 — La edad de la página orienta; la banda la fija el ángulo.** `edad_orientacion` es la del
  comprador principal. La banda de lanzamiento se deriva del `avatar_edad` de cada ángulo con
  Advantage+ OFF (`ETAPA-6.md` → BANDA DE EDAD); si difieren, manda la del ángulo.

### `<pagina_asignada>` — uno de estos dos formatos, sin omitir campos

**FORMATO A — Asignación estándar:**
```
PÁGINA ASIGNADA: [Número] [Nombre de la Página]
Identidad activa: [personaje] — [rol exacto]
Tono para esta campaña: [qué se puede decir, qué NO, cómo abre el copy o el bot]
Edad de segmentación recomendada: [ej. 30+] — [razón basada en el comprador principal]
Razón de asignación: [1-2 oraciones]
Productos del mismo nicho ya en página: [productos_nicho de esa fila]
```

**FORMATO B — Sin página ideal:**
```
⚠️ PRODUCTO SIN PÁGINA IDEAL
Producto: [nombre]
Por qué no encaja en las páginas actuales: [explicación breve]
Página nueva sugerida: [nombre propuesto]
Identidad recomendada: [perfil ideal + nombre sugerido]
Tono: [cómo debería comunicar]
Otros productos futuros que podrían ir ahí: [ejemplos del nicho]
```

---

## Imagen de referencia de FASE 1 (una sola, para las 6 fichas)

De las 3 referencias `ligera` de `Ads/_SWIPE/_BANCO_CREATIVOS/C2_BENEFICIOS/`, elegir la que más
calza con el avatar y el dolor del producto y registrarla con
`python Ads/_TOOLS/referencia_f1.py --elegir <PRODUCTO> <REFERENCIA> --motivo "..."` (dueño único
del dato: `PRODUCTOS/_DIM_REFERENCIA_F1.csv`). Esta etapa no tiene Bash: entrega el comando listo en
el output y lo corre el orquestador. Sin esa elección el paquete de FASE 1 queda incompleto.

---

## Reglas

- **No repetir el mismo ángulo en dos conjuntos:** cada conjunto de testeo lleva un ángulo distinto.
- **Coherencia ángulo ↔ flujo:** lo que promete el anuncio tiene su equivalente en el bot. Si el
  anuncio dice "dolor de ciática", el bot responde sobre ciática, no sobre rodillas.
- **El creativo es la segmentación:** cada señal del copy y del creativo (dolor, beneficio, edad,
  ingrediente) le dice a Meta a quién mostrar el anuncio.
- **Concepto ≠ iteración perezosa:** la misma imagen con otro título o color está prohibida siempre.
  En FASE 1 las 6 piezas comparten concepto, layout y paleta y se diferencian en hook, beneficios,
  props y avatar: son 6 variantes, no 6 iteraciones, y así el resultado se atribuye al ángulo.
- **Ningún ángulo se descarta por falta de video:** todos van en imagen.

## Conexión

- **FASE 1:** las 6 fichas + `<pagina_asignada>` + el comando de la referencia → orquestador →
  `etapa-4`, `etapa-5` y `etapa-6`.
- **Después:** la ficha del ángulo ganador es input de `etapa-11` (FASE 2) y de `etapa-3` (FASE 4)."""
