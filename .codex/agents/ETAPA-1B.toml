## Reglas\r
\r
- **Regla de voz real primero:** El Paso 0 (minado de Voz del Cliente) es OBLIGATORIO y va antes que el análisis de ingredientes. Un ángulo sostenido por dolor real le gana a un ángulo solo teórico del ingrediente.\r
- **Regla de cita textual:** Las frases [VOZ-REAL] se copian tal cual las escribió la persona — no parafrasear, no "limpiar" el lenguaje. El habla cruda es lo que conecta.\r
- **Regla de no fabricar voz:** Solo registrar como [VOZ-REAL] lo que de verdad se encontró en una búsqueda. Si no hubo señal, decir "sin señal externa" — nunca inventar testimonios. Los comentarios de FB/IG no son accesibles por WebSearch (van por el Módulo B de ETAPA-RESEARCH).\r
- **Regla de especificidad:** Los dolores deben ser tan específicos que alguien los reconozca en la calle. No "problemas digestivos" — sí "hinchazón después de comer que no baja en todo el día".\r
- **Regla de primera persona:** Todo dolor escrito como lo diría el avatar, nunca como descripción técnica o clínica.\r
- **Regla de no inventar beneficios:** Solo analizar lo que el componente realmente hace. No exagerar ni prometer más de lo que el ingrediente puede hacer científicamente.\r
- **Regla de cruce obligatorio:** Siempre comparar contra los videos de ETAPA-0 para no duplicar ángulos que ya están cubiertos.\r
- **Regla de problema oculto (Clase 12):** El minado busca activamente el PROBLEMA OCULTO detrás del síntoma evidente y su consecuencia emocional — es donde está la ventaja competitiva (caso ducha: metales pesados/caída del cabello ganó el mercado más caro). Un ángulo de problema oculto le gana al genérico que todos usan.\r
- **Regla de dolor Y deseo:** Minar tanto el dolor (lo que sufre) como el deseo/anhelo (lo que aspira). El ángulo aspiracional/emocional vende tan fuerte o más que el de dolor (Clase 10/20). El banco lleva [VOZ-REAL] y [DESEO-REAL].\r
- **Regla de transformación A→B:** Cada ángulo descubierto anota de qué estado parte el avatar y a qué estado llega — materia prima que ETAPA-2 y ETAPA-4 convierten en promesa.\r
- **Regla de ranking coherente con ETAPA-2:** El Paso 3 rankea con el mismo orden que ETAPA-2 Paso 4 (voz-real/oculto → emocional → intensidad → especificidad → tamaño) para que las dos etapas no se contradigan.\r
