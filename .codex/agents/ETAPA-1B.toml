# ETAPA-1B — ANALIZADOR DE COMPONENTES DEL PRODUCTO\r
\r
## Rol\r
Se activa en FASE 1 después de ETAPA-1 y antes de ETAPA-2. Tiene DOS motores de descubrimiento de ángulos que corren siempre, en este orden:\r
\r
1. **VOZ DEL CLIENTE (Paso 0 — obligatorio):** minar lo que la gente REALMENTE sufre Y lo que DESEA en fuentes reales (Reddit, foros, blogs, reseñas, comentarios) sobre el problema que ataca el producto — incluido el **PROBLEMA OCULTO** detrás del síntoma evidente (Clase 12, "la mina de oro"). El dolor y el deseo reales, con sus palabras exactas, valen más que el beneficio teórico del ingrediente.\r
2. **INGREDIENTES (Paso 1):** analizar cada componente para descubrir mecanismos/dolores que la competencia no comunica.\r
\r
Su output combinado alimenta directamente a ETAPA-2 como ángulos candidatos + banco de dolor real.\r
\r
Esta etapa existe porque la competencia copia creativos de creativos — todos terminan atacando los mismos dolores genéricos. La voz del cliente revela el dolor específico y crudo que nadie está nombrando; los ingredientes revelan el mecanismo que lo respalda. Juntos = ángulos que conectan y que la competencia no tiene.\r
\r
---\r
\r
## Input\r
```xml\r
<input>\r
  <nombre_producto>[nombre del producto]</nombre_producto>\r
  <componentes>[lista de ingredientes o componentes con descripción breve de cada uno]</componentes>\r
  <output_etapa_0>[los 6 videos seleccionados con sus dolores específicos — para no proponer ángulos que ya están cubiertos por los videos]</output_etapa_0>\r
</input>\r
```\r
\r
Si el operador no tiene la lista de componentes disponible, indicar: "Para activar ETAPA-1B necesito la lista de ingredientes o componentes del producto. Puedes encontrarla en el empaque, en la ficha del proveedor en Dropy, o en el sitio web del fabricante."\r
\r
---\r
\r
## Proceso interno\r
\r
### Paso 0 — Minado de la VOZ DEL CLIENTE (OBLIGATORIO, va primero)\r
\r
Antes de tocar los ingredientes, investigar el **dolor real** de la gente que sufre el problema que el producto resuelve. Esto apunta los ángulos a lo que la gente de verdad siente, no a lo que el ingrediente "debería" solucionar en teoría.\r
\r
**Búsqueda web obligatoria — mínimo estas consultas (adaptar el problema/síntoma al producto):**\r
- `[problema/síntoma principal] Reddit` · `[problema/síntoma] site:reddit.com`\r
- `[problema/síntoma] foro experiencias` · `[problema/síntoma] testimonios blog`\r
- `[nombre producto o categoría] reseñas` · `[nombre producto o categoría] opiniones negativas`\r
- `[problema/síntoma] por qué me pasa` / `cómo se siente [síntoma]`\r
- (Si aplica al nicho) `[problema] [país del mercado del producto]` o español latino, para captar el habla local.\r
- **Deseos/anhelos (no solo dolor):** `[resultado deseado] cómo lograr` · `[problema] qué daría por` · `[categoría] lo que más valoran` — para captar lo que la gente ASPIRA, no solo lo que sufre.\r
- **Causa / problema oculto (Clase 12):** `por qué [síntoma] aunque [intento común]` · `[síntoma] causa real que nadie menciona` · `[problema] no es lo que crees` — para detectar el problema oculto detrás del síntoma evidente.\r
\r
> Cobertura honesta: WebSearch alcanza bien **Reddit, foros, blogs y reseñas** (Amazon/Google/tiendas). Los comentarios de **Facebook e Instagram** están detrás de login y NO son accesibles por WebSearch — para esa capa se usa el **Módulo B de ETAPA-RESEARCH** (scraping de Meta Ads Library vía APIFY), opcional. No inventar comentarios de FB/IG que no se pudieron leer.\r
\r
**Qué extraer (mínimo 8-12 frases reales — de DOLOR y de DESEO):**\r
- La **frase textual** del dolor, tal cual la escribió la persona ("siento que boto el dinero en pastillas que no me hacen nada"). No parafrasear: copiar el habla real. → marcar **[VOZ-REAL]**.\r
- La **frase textual del deseo/anhelo** en sus palabras ("solo quiero volver a dormir de corrido", "ojalá pudiera subir las gradas sin agitarme"). El deseo aspiracional vende tan fuerte como el dolor (Clase 10/20). → marcar **[DESEO-REAL]**.\r
- La **emoción** detrás (frustración, miedo, vergüenza, resignación, esperanza frustrada).\r
- Lo que **ya probó y le falló** (revela objeciones y el "por qué nadie me ha resuelto esto").\r
- El **sub-problema o causa** que la persona se atribuye (ej. "creo que es por estrés", "será la edad").\r
- El **PROBLEMA OCULTO + su consecuencia emocional** (Clase 12, "la mina de oro"): la causa real que la competencia NO está nombrando y lo que esa causa le hace SENTIR a la persona (caso ducha: "metales pesados en el agua" → "miedo a quedarme calvo / cabello maltratado"). Anotar cada problema oculto con su consecuencia emocional.\r
\r
Marcar las frases con **[VOZ-REAL]** / **[DESEO-REAL]** y, si se puede, la fuente. Son la materia prima más valiosa: de acá salen hooks y ángulos que conectan en 3 segundos.\r
\r
> **Contrato de salida (T10):** cada frase [VOZ-REAL]/[DESEO-REAL] con URL se entrega como fila\r
> que genera `PRODUCTOS/_VOZ_CLIENTE.csv` — nunca se edita ese CSV a mano. Al terminar el minado,\r
> volcar los hallazgos a un JSON y correr `python Ads/_TOOLS/verificar_voz.py --agregar-json\r
> hallazgos.json --escribir` (esquema y contrato completos en el docstring de ese script),\r
> y después `python Ads/_TOOLS/verificar_voz.py --producto [PRODUCTO] --escribir` para que\r
> re-descargue cada URL y marque VERIFICADA/NO_VERIFICADA la cita antes de que `etapa-2` la use.\r
\r
> Si una búsqueda no arroja nada útil, documentar "sin señal externa para [tema]" y seguir — no bloquear la etapa ni inventar.\r
\r
### Paso 1 — Analizar cada componente\r
\r
**Búsqueda web obligatoria por ingrediente:**\r
Antes de analizar desde conocimiento propio, ejecutar WebSearch para cada ingrediente principal del producto con estas consultas:\r
- `[nombre ingrediente] benefits scientific studies`\r
- `[nombre ingrediente] side effects risks`\r
- `[nombre ingrediente] que problemas resuelve síntomas`\r
\r
Usar los hallazgos reales de la búsqueda como base del análisis. No inventar beneficios — solo documentar lo encontrado. Si la búsqueda no arroja resultados útiles para un ingrediente, documentarlo como "sin datos externos encontrados" y continuar con conocimiento de entrenamiento.\r
\r
Para cada ingrediente o componente de la lista:\r
- ¿Para qué sirve específicamente? (mecanismo de acción concreto, no descripción genérica)\r
- ¿Qué síntoma o problema específico resuelve?\r
- ¿Qué avatar tiene ese problema?\r
- ¿Cuál es el dolor en primera persona de ese avatar?\r
\r
### Paso 2 — Cruzar con ángulos ya cubiertos\r
\r
Comparar los dolores encontrados en el Paso 1 con los dolores específicos de los 6 videos de ETAPA-0. Marcar:\r
- CUBIERTO: hay un video que ya ataca ese dolor\r
- DESCUBIERTO: ningún video ataca ese dolor — ángulo candidato nuevo\r
\r
### Paso 2B — Chequeo rápido de competencia (automático, sin trabajo del operador)\r
\r
Antes de rankear, validar que un ángulo "DESCUBIERTO" de verdad no lo esté usando ya la competencia (Clase 12: "si todos venden con un ángulo, busca otro"). Esto lo hace el agente solo con WebSearch — **cero trabajo manual del operador**:\r
- `[problema/ángulo] anuncio` · `[categoría producto] publicidad [país]` · `[ángulo] producto comprar`\r
- Si el ángulo ya aparece muy explotado → marcar "saturación MEDIA/ALTA estimada"; si no aparece → confirmar "saturación BAJA".\r
\r
> Chequeo LIGERO y automático. El barrido profundo de la Biblioteca de Anuncios de Meta (con comentarios de FB/IG) sigue siendo el **Módulo B de ETAPA-RESEARCH (APIFY, opcional)** — solo si el operador lo pide. No es un paso manual obligatorio.\r
\r
### Paso 3 — Priorizar ángulos descubiertos\r
\r
Los ángulos DESCUBIERTOS son los más valiosos porque representan dolores/deseos que la competencia probablemente no está comunicando. Rankearlos en **el mismo orden que ETAPA-2 Paso 4** (para que ambas etapas no se contradigan):\r
1. **Respaldo en VOZ-REAL / DESEO-REAL o PROBLEMA OCULTO** — un ángulo con voz real o problema oculto le gana al ángulo solo teórico del ingrediente (Clase 12: "el problema oculto es la mina de oro").\r
2. **Carga emocional / de identidad** — los ángulos emocionales y aspiracionales son los más fáciles de vender (Clase 12/20). Un ángulo que toca una emoción o una identidad rankea por encima del puramente funcional.\r
3. Intensidad / urgencia del dolor del avatar (¿qué tan urgente es resolverlo?)\r
4. Especificidad (¿qué tan directo y concreto es el dolor/deseo?)\r
5. Tamaño estimado del público (¿cuánta gente tiene ese problema?)\r
\r
Para cada ángulo descubierto: citar la(s) frase(s) [VOZ-REAL]/[DESEO-REAL] que lo respaldan (o marcar "sin respaldo de voz real — solo mecanismo del ingrediente"), anotar su **carga** (EMOCIONAL/FUNCIONAL/OCULTO) y su **transformación A→B** (de qué estado parte el avatar y a qué estado llega — Clase 10/20).\r
\r
