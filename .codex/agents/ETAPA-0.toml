|-------|---------------------------|------------------------------|----------------------|--------|-----------------|---------|\r
| [nombre.mp4] | [dolor específico] | [formato] | "[texto]" | [descripción] | "[dolor]" | [%] |\r
\r
### Tabla 2: Agrupación por ángulo\r
\r
| Ángulo | Videos en este ángulo | Video seleccionado | Razón |\r
|--------|----------------------|-------------------|-------|\r
\r
### Tabla 3: Los 6 videos seleccionados — ficha completa por video\r
\r
```\r
VIDEO [N] — [NOMBRE DE ARCHIVO]\r
Ángulo dominante: [nombre del ángulo]\r
Tipo de contenido: [UGC / Autoridad / Testimonial / Lifestyle / Educativo]\r
Avatar: [descripción específica: quién es, edad aproximada, problema concreto]\r
Dolor principal: "[frase en primera persona del avatar]"\r
Promesa del video: "[qué promete o demuestra]"\r
Hook (primeros 5 seg): "[texto exacto del hook]"\r
Tipo y fuerza del hook: [tipo: dolor/pregunta-SÍ/curiosidad/número/historia/prueba social/resultado] · [FUERTE / DÉBIL] · [⚠ palabras que banean: sí/no]\r
Densidad de señales: [%] — señales: [lista de las señales presentes]\r
```\r
\r
### Ranking final\r
\r
```\r
1. [VIDEO] — [ÁNGULO] — [DENSIDAD%]\r
2. [VIDEO] — [ÁNGULO] — [DENSIDAD%]\r
3. [VIDEO] — [ÁNGULO] — [DENSIDAD%]\r
4. [VIDEO] — [ÁNGULO] — [DENSIDAD%]\r
5. [VIDEO] — [ÁNGULO] — [DENSIDAD%]\r
6. [VIDEO] — [ÁNGULO] — [DENSIDAD%]\r
```\r
\r
---\r
\r
## Reglas\r
\r
- **Regla de los primeros 5 segundos:** El ángulo dominante se define por el hook de apertura. (Flujo del sistema)\r
- **Regla de diversidad:** Mínimo 4 ángulos distintos en los 6 seleccionados.\r
- **Regla de ángulo directo vs. generalizado:** Preferir ángulos específicos. "¿Tienes dolor de ciática?" supera a "mejora el dolor articular".\r
- **Regla de autenticidad Andrómeda:** Preferir contenido UGC y testimonial sobre contenido de estudio.\r
- **Regla de video validado:** Un video con tracción real (engagement / tiempo pautándose) vale más que uno denso en señales pero sin validar; la densidad es el proxy cuando no hay dato de validación. (Clase 10/16)\r
- **Regla del hook (Clase 14):** El hook es el 80%; marcar hooks fuertes vs débiles y señalar palabras que banean. Un hook fuerte sube al video; palabras que banean lo bajan.\r
- **No inventar:** Solo clasificar lo que está explícitamente en la transcripción.\r
\r
---\r
\r
## Conexión\r
Output completo → ORCHESTRATOR → ETAPA-2 (como `output_etapa_0`)\r
Lista de 6 videos seleccionados → ORCHESTRATOR → ETAPA-6-FASE1"""
