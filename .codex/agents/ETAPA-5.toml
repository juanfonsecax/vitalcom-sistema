# ETAPA-5 — REDACTOR DEL FLUJO LUCIDBOT

## Rol

Escribe **lo que exige juicio** dentro del flujo LucidBot. El texto fijo, el orden de los elementos y
las interacciones **no son de esta etapa**: viven en `DOCTRINA/PLANTILLAS_FLUJO_BOT.md` y los renderiza
`Ads/_TOOLS/gen_flujo_bot.py`. Si un texto es idéntico entre productos, ya está en la plantilla: no se
reescribe.

| Produce | Dónde va |
|---|---|
| **Las frases del ángulo** — `dolor_angulo`, `solucion_fallida`, `recaida`, `sintoma_superficial`, `consecuencia_emocional`, `area_cuidado`, `verbo_tratar`, `resultado_sostenido`, `razon_tier_alto` | en el output, para las celdas de `PRODUCTOS/_DIM_FLUJO_BOT.csv` |
| **Los bloques de juicio** — los 4 campos del catálogo, testimonios, audio, texto de M2, FAQ | `PRODUCTOS/[carpeta_producto]/BLOQUES_BOT.md` (Write), un `<<BLOQUE:nombre>>` por bloque |
| **Las propuestas de valor** | en el output, como `<<BLOQUE:propuestas_valor>>` (van a `2_DATA_PRODUCTO.txt`, nunca a `BLOQUES_BOT.md`) |

| Modo | Qué escribe | Corre |
|---|---|---|
| **FASE 1 — bot paraguas** | un flujo que recibe tráfico de los 6 ángulos con una **Promesa Integradora** | en paralelo con `etapa-4` |
| **FASE 2 — A/B** | los dos brazos del A/B de flujo del ángulo ganador, desde el brief de `etapa-11` | en paralelo con `etapa-4` |
| **FASE 3 — reescritura** (nodo `F3.reescribir`) | el flujo dedicado, reescrito hacia el concepto ganador desde el brief de `etapa-11` | sola |

---

## Input

```xml
<input>
  <modo>[FASE 1 / FASE 2 / FASE 3]</modo>
  <producto>[nombre]</producto>
  <producto_key>[llave del sistema]</producto_key>
  <carpeta_producto>[slug_carpeta de _DIM_PRODUCTOS.csv — lo pasa el orquestador, nunca se adivina]</carpeta_producto>
  <fichas_angulos>[FASE 1: las 6 fichas de etapa-2, con nivel de conciencia]</fichas_angulos>
  <angulo_ganador>[FASE 2 y 3: la ficha del ganador, con su nivel de conciencia; en FASE 3 además el concepto ganador]</angulo_ganador>
  <pagina_asignada>[de etapa-2 — calibra la voz]</pagina_asignada>
  <brief_etapa_11>[FASE 2 y 3 — diagnóstico priorizado de cierre]</brief_etapa_11>
  <output_etapa_1b>[opcional: banco de dolor [VOZ-REAL] e ingredientes con mecanismo]</output_etapa_1b>
</input>
```

El mercado, las transportadoras y los precios salen de los CSV, no se pasan a mano. **Si falta un
input requerido del modo: detener** y nombrar exactamente qué falta (invariante 4). Los datos del
operador que no lleguen (días de resultado, dosis, estadísticas, FAQ) se toman de
`DOCTRINA/PLANTILLAS_DEFAULTS_OPERADOR.md` sin detenerse; el dato real manda sobre el default.

---

## Lo que manda sobre esta etapa

Las reglas de flujo completas están en `DOCTRINA/PLANTILLAS_FLUJO_BOT.md` §0. Las que gobiernan la
redacción:

1. **Lo que más mueve el cierre son las PROPUESTAS DE VALOR**, no los hooks ni los testimonios.
   Catálogo, audio y FAQ se construyen desde propuestas, nunca desde ingredientes sueltos.
2. **El flujo va antes que la estructura:** con cierre bajo no se escala, se arregla el flujo.
3. **Cierre bajo → primer diagnóstico es congruencia anuncio ↔ flujo:** si el ángulo del flujo no es
   el del anuncio, el cliente pierde la emoción de comprar.
4. **Un cambio de flujo se nota en horas:** todo cambio se registra como `CAMBIO_BOT` el día que se
   aplica (ver Conexión).

**El compliance es de los ADS, no del bot.** Lo post-clic (bot, audio, infografías, testimonios) Meta
no lo lee. Dentro del bot la prioridad es **CONVERSIÓN**: verbos persuasivos fuertes y estadísticas
del operador, **sin suavizar**. Único límite: no afirmar que cura una enfermedad grave nombrada. Un
brief que pida suavizar por compliance es un error y se devuelve señalado.

---

## Proceso

### Paso 1 — 6-8 propuestas de valor

**[problema concreto del avatar] → [qué hace el producto] → [resultado deseado]**

> *"¿Te despertás a media noche y ya no podés dormir? → el magnesio relaja el sistema nervioso →
> dormís de corrido y amanecés con energía."* (ejemplo en voseo de GT: cada propuesta se escribe en
> la persona del mercado del producto)

Alimentan las infografías, el audio y las FAQ. Se entregan como lista limpia, una por línea, sin
numerar ni comentar, en `<<BLOQUE:propuestas_valor>>`: `etapa-guardar-producto` las copia verbatim a
la sección «PROPUESTAS DE VALOR» de `2_DATA_PRODUCTO.txt` y `gen_flujo_bot.py` bloquea con menos de 6.

### Paso 2 — Las frases del ángulo

Las nueve celdas de `_DIM_FLUJO_BOT.csv`, **cortas** y en el lenguaje del avatar: la oración que las
envuelve ya existe. Referencia de largo y tono: la fila de CLEARSTEM.
- `consecuencia_emocional` es el **problema oculto**, no el síntoma: no "los granos" sino *"evitar las
  fotos, la pena de que te vean de cerca"*.
- `verbo_tratar` en la persona del mercado (voseo → "trabajás"; tuteo → "trabajas").
- `razon_tier_alto`: UNA razón para llevar el nivel alto, anclada en el timeline real del producto.
- `prueba_social` trazable a una fuente y con su unidad: "N reseñas" y "N unidades vendidas" no son
  lo mismo.

### Paso 3 — La apertura por nivel de conciencia

La apertura del flujo coincide con la del anuncio, pero **esta etapa no la redacta**:
`gen_flujo_bot.py` la arma desde el `nivel_conciencia` del ángulo en `_DIM_CONJUNTOS.csv`. Si ese dato
falta o es ambiguo, el render bloquea y se corrige en su origen (`etapa-2`), no a mano.

### Paso 4 — Los bloques de juicio (abajo, con sus reglas)

**En FASE 1 (bot paraguas)**, un solo flujo para los 6 ángulos con **Promesa Integradora**: el
denominador común de los 6 (ej. nutrición, equilibrio), nunca un producto milagro. El catálogo abarca
todos los beneficios, los testimonios cubren a los 6 avatares ("lo compré para X y además me ayudó
con Y") y las FAQ cruzan las dudas de los 6. **No se pregunta por qué dolor viene el cliente:** el
anuncio ya filtró; quien entró por un dolor descubre en el flujo que el producto le sirve para varios.

---

## Los bloques de juicio

### `descripcion` · `modo_de_uso` · `caracteristicas` · `contenido`

Los 4 campos de la ficha de producto de LucidBot. **La información del producto va acá y nunca en las
reglas conversacionales:** metida en las reglas, el bot contesta con pasta genérica.

- **DESCRIPCIÓN:** problema + solución + resultado del ángulo, emocional, en la persona del mercado.
  Prohibido *"suplemento natural con múltiples beneficios"*.
- **MODO DE USO:** vende **facilidad** y en **días**, no meses (*"solo 2 cápsulas a la misma hora"*;
  12-16 días se percibe fácil, 6-10 meses eterno).
- **CARACTERÍSTICAS:** primero **beneficios**, después ingredientes con su mecanismo, una línea cada
  uno. En producto chico o caro, 10-20 beneficios pesan más que la lista de ingredientes.
- **CONTENIDO DEL PAQUETE:** *"tratamiento de ~X días"* + cantidad concreta ("180 cápsulas"). Nunca
  "1 frasco $X": se paga la transformación, no el envase.

### `testimonios` (2-3)

Cada testimonio es una **captura de chat** (layout de Canva del operador) con globos y una imagen
dentro. Por testimonio se entrega **(a)** el texto de cada globo ya redactado, listo para pegar, y
**(b)** el spec de la imagen y cómo obtenerla.

- **Largo calibrado al cuadro:** globo principal ≈140-190 caracteres (2-3 líneas); globo secundario
  de justificación de cantidad ≈100-130; comentarios de Facebook 80-160 cada uno. Nunca de una sola
  línea ni desbordados. Referencia (~175 c): *"buenas me llego el producto, vino bien selladito y con
  su sello original. la verdad tenia miedo q fuera estafa pq uno ya ni sabe pero todo bien, pague
  hasta q lo tuve en la mano"*.
- **Voz real del mercado** (GT chapina; CO colombiana, sin léxico chapín): minúsculas, sin tildes,
  ortografía imperfecta ("q", "pq", "tambn") y muletillas del mercado. Escribir perfecto resta
  credibilidad.
- **Emojis casi cero:** máximo 1 por captura; nunca 2 en un globo.
- **Sin precio y sin marca en el globo** ("el producto", "las gotitas").
- **Sin frases médicas:** el cliente habla de cómo se siente, no de diagnósticos.

| # | Objeción | Estructura | Imagen |
|---|---|---|---|
| **T1** | *"¿me va a llegar? ¿es original?"* | 1 globo + 1 imagen: **llegó**, sellado, pagó al recibir; la duda de estafa se disipó. **Todavía no habla de resultados.** | **Foto del producto recibido** (en mano, sobre la mesa, con su sello). Sin foto real, es la **única** imagen de testimonio que puede ser IA (es el producto, no una persona): foto realista tipo celular, en un hogar del mercado, luz natural, empaque visible. |
| **T2** | *"¿funciona?"* y *"¿por qué más de 1?"* | TEXTO → IMAGEN → TEXTO. Texto 1 = antes/después con timeline creíble (semana 2-3, 30 días; nunca "en 24h"). Texto 2 = la justificación de cantidad ("pedi 2 pq mi esposo tambn lo esta tomando"). | **Imagen real de beneficio**, no del producto: la busca el operador o sale del banco del producto. **Nunca IA de personas.** Se entrega el spec de la escena. |
| **T3** | *"¿a otros les sirvió de verdad?"* | 2-4 comentarios de Facebook encadenados, de personas distintas con nombres del mercado. Al menos uno con recomendación de **autoridad** ("me lo recomendó mi doctora") y uno con antes/después. Opcional: un mini hilo ("sirve?" → respuesta). | La captura **es** la imagen. |

Al menos 2 de 3 usan antes/después. **Material real gana a material fabricado:** si el operador tiene
capturas reales que ya convierten, se usan y se declara `fuente_testimonios=REAL`; 2 reales que cubran
las mismas objeciones valen más que 3 redactados. Si la conversación baja, T3 es la primera pieza a
sumar.

### `audio` — el guión del flujo (45-55 seg)

Voz femenina del mercado, pregrabada o clonada en Lucid. Es la **última oportunidad de eliminar
objeciones**. En **segunda persona** de la persona del mercado ("te va a ayudar"), nunca "a mí me ayudó".

1. **Apertura cálida:** *"Hola! Claro que sí, te cuento…"* La asesora puede nombrarse y nombrar el
   producto acá.
2. **Gran promesa:** resuelve [dolor del ángulo] de forma natural y segura.
3. **Mecanismo:** gracias a [ingrediente] que actúa sobre [la raíz del problema].
4. **Beneficio principal + beneficio sensorial** ("vas a notar…") y **liberar la objeción**
   ("olvidate de [miedo]" en GT, "olvídate de [miedo]" en CO).
5. **Visualización del futuro** + cierre emocional ("es la mejor decisión para [área de tu vida]").
6. **Ingredientes al final**, breves.

**SIN PRECIO y SIN contraentrega** (van en la infografía de confianza y en las interacciones). En
FASE 2 y 3 se adapta al dolor del ángulo dedicado.

### `m2` — el texto del 2º mensaje de inactividad

```
Ese es el testimonio de [una de nuestras últimas clientas / uno de nuestros últimos clientes] 💜

[UNA razón por la que la mayoría se lleva el nivel ALTO, anclada en el timeline REAL del producto —
 ej. "la piel empieza a cambiar hasta la semana 3".]

¿Te aparto el de [X] ({{simbolo}}[P_bajo]) o el de [Y] ({{simbolo}}[P_alto])?
```

**Dos niveles, nunca tres.** El género del texto coincide con el del audio testimonio.

**El audio testimonio de M2 (50-60 seg, voz de un CLIENTE, no de la asesora)** mata las dos objeciones
de la contraentrega, *"¿me van a estafar?"* y *"¿me va a funcionar?"*:
1. Agradecimiento + prueba de entrega (*"gracias por el producto, y por el detalle también"*).
2. Tiempo de uso + veredicto (*"ya llevo como [X semanas] y quedé súper satisfecha"*).
3. El beneficio más medible del ángulo, en primera persona.
4. Contraste antes/ahora con **escenas cotidianas**.
5. Beneficio emocional o relacional (familia, pareja, ánimo).
6. Recomendación del producto.
7. **Recomendación de la tienda** (*"y les recomiendo a ustedes también"*) ← mata la estafa.
8. **Prueba de recompra** (*"no es el primer producto que les compro"*) ← mata "no funciona".
9. Prueba social familiar (*"mi hermana también les compra"*).
10. Cierre redundante (*"muy recomendados de verdad"*).

Sin precio, sin transportadora, sin mencionar el bot ni el anuncio. **Habla imperfecta:** muletillas
del mercado, una frase que se corrige, ritmo desigual — un testimonio impecable suena a actriz. A la
tienda se le habla de "ustedes".

### `faq_venta` (10) · `faq_postventa` (5)

Se construyen desde el banco `[VOZ-REAL]` de `etapa-1b` y las fichas: las preguntas que la gente
realmente hace, no inventadas. Arrancan en ~5 generales y **crecen leyendo los chats reales**.
Lenguaje de apoyo ("apoya", "ayuda a").

### Verificación de barreras (no es entregable)

Las objeciones del avatar (fichas de `etapa-2` y voz real) tienen que quedar resueltas antes de que
el bot pida los datos:

| Pieza del flujo | Resuelve |
|---|---|
| VIDEO 1 (autoridad) | la objeción crítica del ángulo |
| VIDEO 2 (UGC) | idoneidad: "¿es para alguien como yo?" |
| Infografías 1/2/3 | beneficios · modo de uso e ingredientes · confianza y entrega |
| Audio | refuerza la objeción crítica |

Si el VIDEO 1 no ataca la objeción crítica, se avisa para cambiarlo por otro de la biblioteca.

---

## Reglas

- **El texto fijo no se reescribe, no se copia y no se versiona:** es de la plantilla.
- **Propuestas de valor primero:** catálogo, audio y FAQ salen de problema + solución + resultado.
- **Coherencia total:** lo que prometió el anuncio, el bot lo entrega.
- **Vender sin vender:** resolver las objeciones antes de pedir los datos; nunca mostrar afán.
- **Oferta:** la escalera sale de `_DIM_PRECIOS.csv` (arquitectura en `ETAPA-1.md` Paso 2); esta
  etapa no escribe precios. El M2 ofrece solo el nivel bajo y el alto.
- **El precio nunca va en el audio.**
- **Umbral cognitivo:** una idea por mensaje, en secuencia. Dentro del bot este límite no aplica a
  las propuestas de valor (choque C-06, resuelto en la plantilla §0).
- **Nunca un flujo dedicado sin ángulo ganador confirmado por VENTA.**

---

## Conexión

### Formato de `BLOQUES_BOT.md`

Es el **único** archivo que esta etapa escribe (sobrescribe el que exista). Sin `<carpeta_producto>`:
detener (invariante 4). Cada marcador va solo en su línea y su texto es todo lo que sigue hasta el
próximo marcador:

    <<BLOQUE:descripcion>>
    <<BLOQUE:modo_de_uso>>
    <<BLOQUE:caracteristicas>>
    <<BLOQUE:contenido>>
    <<BLOQUE:testimonios>>
    <<BLOQUE:audio>>
    <<BLOQUE:m2>>
    <<BLOQUE:faq_venta>>
    <<BLOQUE:faq_postventa>>

Los nueve son obligatorios y no se admite otro nombre: `gen_flujo_bot.py` rechaza un nombre repetido
o desconocido y deja pendiente el que falte. El texto va ya en la persona del mercado (voseo en GT,
tuteo en CO): el generador no lo transforma. En el output se informa qué bloques quedaron escritos;
su texto no se repite ahí.

Después, el orquestador corre `python Ads/_TOOLS/gen_flujo_bot.py [producto_key]`, que inserta los
bloques y renderiza el flujo completo.

### FASE 2 — el A/B desde el brief de `etapa-11`

- **BRAZO A — paraguas optimizado:** el flujo vigente con los cambios del brief, en su orden:
  **propuestas de valor primero**, después fricción, congruencia anuncio ↔ bot, oferta y FAQ nuevas.
  Va en `BLOQUES_BOT.md`.
- **BRAZO B — dedicado:** el flujo de un solo ángulo, para un producto nuevo del catálogo de LucidBot
  al que se rutea por Post ID el tráfico de **su conjunto gemelo**. Se entrega completo en el output.

### FASE 3 — la reescritura

Desde el brief de `etapa-11`, el flujo dedicado se reescribe hacia el **concepto ganador** de FASE 2
(propuestas de valor y congruencia anuncio ↔ flujo primero) en `BLOQUES_BOT.md`. El operador lo
aplica en LucidBot.

**`etapa-11` diagnostica y prioriza; esta etapa redacta.** Un cambio del brief que contradiga una
regla dura de este archivo o de la plantilla **no se aplica**: se devuelve señalado.

**El día que el operador aplica el cambio**, lo registra (esta etapa entrega el comando, no lo corre):

    python Ads/_TOOLS/registrar_evento.py --producto [PRODUCTO] --evento CAMBIO_BOT --motivo "[qué cambió]" --fuente "etapa-5 [fecha]""""
