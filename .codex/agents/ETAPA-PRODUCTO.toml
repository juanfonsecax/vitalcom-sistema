candidato (o varios). Aplica el sistema de puntuación de aptitud para e-commerce de\r
impulso y entrega un veredicto (APTO / NO APTO) con score 0–1 y código de color, más\r
una guía de qué datos de mercado conseguir. NO garantiza éxito — mide qué tan apto es\r
el producto para el modelo de venta por WhatsApp.\r
\r
