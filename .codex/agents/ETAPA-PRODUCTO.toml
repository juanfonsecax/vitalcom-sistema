\r
## Proceso interno\r
\r
### Paso 1 — Filtro de descarte rápido (manual — Clase 5 Pipe + Clase 16)\r
Antes de puntuar, descartar si:\r
- Lo tienen MUCHOS proveedores en Dropy (>10) o es el más visto → saturado.\r
- Se consigue fácil en el mercado tradicional (farmacia, esquina, gasolinera, supermercado) → la gente va a comprarlo allá.\r
- Es de temporada.\r
\r
Señales MANUALES de validación (sin herramientas de pago — lo que el operador SÍ puede mirar):\r
- **Biblioteca de Anuncios (regla del 10%, Clase 5):** nº de anuncios ÷ 10 ≈ nº de tiendas. **>20 tiendas = guerra de precios** → NO entrar, SALVO que tengás un ángulo que nadie usa o que nadie lo venda por WhatsApp (público distinto al de landing = mercado sin explotar). ~2-4 que pautan = poca competencia, testeable.\r
- **Proveedores en Dropy:** pocos (<6-7) = producto nuevo/poco regado = menos competencia (el scroll de Dropy es aleatorio: a menos proveedores, menos le aparece a la competencia).\r
- **TikTok/Reels:** muchas reacciones/vistas/comentarios "¿dónde lo compro?" = potencial viral (Clase 5).\r
- **Conocimiento del operador (Clase 5):** "todos saben de algo" — usar la experiencia propia para juzgar si resuelve un dolor real y tiene efecto WOW.\r
> Las VENTAS reales (Drop Killer) serían la validación ideal pero son OPCIONALES; si no se tienen, las señales manuales de arriba + los 17 criterios bastan para decidir. La validación NUNCA se bloquea por no tener métricas de ventas.\r
\r
### Paso 2 — Puntuación de aptitud (Excel Validación — fórmula exacta)\r
Marcar cada criterio como SÍ/NO:\r
\r
DECISIVO (eliminatorio):\r
- D1: Resuelve un problema específico.\r
\r
OBLIGATORIOS (todos eliminatorios):\r
- O1: Stock ilimitado / suficiente.\r
- O2: Ligero y no frágil.\r
- O3: Proveedor verificado o de buena calificación.\r
- O4: No es de temporada.\r
\r
RECOMENDADOS (suman puntaje, 12):\r
- R1 Micronicho · R2 Innovador o poco común · R3 Percepción de valor · R4 Público masivo\r
- R5 No se encuentra en el mercado tradicional · R6 Ticket bajo (< 30 USD) · R7 Potencial viral\r
- R8 Tamaño no muy grande · R9 Sin variaciones complejas · R10 Vendible en combos de cantidades\r
- R11 Efecto WOW (curiosidad/sorpresa) · R12 Margen mínimo ≥ 3 USD después de TODOS los gastos\r
\r
FÓRMULA:\r
- Si D1 y O1..O4 son TODOS SÍ → score = 0.5 + (n.º de R en SÍ × 0.5/12).\r
- Si D1 o cualquier O falla → score = 0 (NO APTO, no importa cuántos R cumpla).\r
- Escala: 0 = ROJO (no apto) · 0.5 = umbral (pasa) · 1.0 = VERDE (óptimo).\r
\r
### Paso 3 — Veredicto y recomendación\r
- ROJO (0): descartar y explicar qué criterio eliminatorio falló.\r
- 0.5–0.79: apto, pero señalar qué recomendados mejorar.\r
- ≥0.80 (verde): producto fuerte, pasar a ETAPA-1 (costeo) y luego ETAPA-0.\r
\r
