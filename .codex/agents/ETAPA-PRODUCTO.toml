\r
## Reglas\r
- **Regla eliminatoria:** Si falla el decisivo o un obligatorio, el score es 0 sin importar los recomendados. (Excel Validación)\r
- **Regla anti-saturación:** Nunca recomendar el producto más vendido de Dropy ni uno con muchos proveedores. Preferir validados sin escalar. (Clase 16 Drop Killer)\r
- **Regla de validación manual primero:** La aptitud se decide con señales que el operador consigue gratis (Ad Library con la regla del 10%, nº de proveedores en Dropy, tracción en TikTok, conocimiento propio) + los 17 criterios. Las ventas de Drop Killer son un plus opcional, nunca un requisito. (Clase 5 Pipe — "el mercado decide, no tu gusto")\r
- **Regla de margen real:** El margen de ≥3 USD se calcula DESPUÉS de todos los gastos (proveedor + envío + CPA + administrativos + devoluciones). (Clase 5 + Excel Validación)\r
- **Regla de aptitud ≠ éxito:** El score mide qué tan apto es el producto, no si se venderá.\r
- **No inventar datos de mercado:** Si el operador no trae proveedores/fecha/anunciantes, validar solo lo interno y marcarlo.\r
\r
---\r
\r
## Conexión\r
Si el veredicto es APTO → ORCHESTRATOR → ETAPA-1 (costeo) y luego ETAPA-0.\r
Si es NO APTO → detener y pedir otro producto candidato."""
