[project]
name = "vitalcom-app"
version = "0.1.0"
description = "La pantalla del sistema VITALCOM: lee contratos y dispara ejecutores declarados."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "dbos>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-timeout>=2.3",
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Salvavidas por prueba, no por corrida completa. pytest-timeout tiene dos métodos: `signal`
# (Unix, aísla la prueba colgada con su propio traceback) y `thread` — el único que existe en
# Windows —, que al vencer el plazo vuelca los stacks de todos los hilos y ABORTA la corrida
# completa (no aísla nada). Ver odd/tasks/vista-por-que.md T1: la suite completa NO cuelga (160
# passed en ~5 min limpio); esto es un tope de 120s por prueba para no esperar indefinidamente si
# algo sí llega a colgarse, no un fix de un hang real.
timeout = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitalcom_app"]
