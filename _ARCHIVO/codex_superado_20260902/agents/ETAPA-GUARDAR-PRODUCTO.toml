## GATE DE RECONCILIACIÓN (obligatorio antes de cerrar)\r
> El producto NO está "completo" hasta pasar este gate. Garantiza que el sistema entregue **siempre lo mismo**, sin que un rerun deje datos que se contradicen entre archivos.\r
\r
Verificar que estos 6 valores son **idénticos** donde aparezcan (encabezado de los 3 archivos + cuerpo) y coinciden con los INPUTS CONGELADOS del orquestador:\r
\r
| # | Valor | Debe coincidir en |\r
|---|---|---|\r
| 1 | COSTO_PROVEEDOR_Q | encabezado · 2_DATA (costeo) |\r
| 2 | PRECIOS P1u/P2u/P3u | 2_DATA (costeo) · 1_HACER_MANUAL (copies + bot) · 3_CAMPAÑA |\r
| 3 | DOSIS / presentación | encabezado · 2_DATA (componentes) · 1_HACER_MANUAL (infografías + bot) |\r
| 4 | PROVEEDORES_DROPY | 2_DATA (un solo número) |\r
| 5 | FANPAGE (Formato A/B + page_id) | los 3 archivos |\r
| 6 | campaign_id + 6 ad_set_id | 3_CAMPAÑA · REGISTRO DE CONJUNTOS de 2_DATA |\r
| 7 | NOMBRE_CONJUNTO de cada conjunto (exacto) | REGISTRO DE CONJUNTOS de 2_DATA · `_DIM_CONJUNTOS.csv` · 3_CAMPAÑA |\r
| 8 | ángulo · formato · precio_en_ad de cada conjunto | 2_DATA · `_DIM_CONJUNTOS.csv` (mismo valor, sin excepción) |\r
\r
**Si hay UNA discrepancia → corregir y reescribir; NO entregar.** Reportar al operador qué se reconcilió. Si el operador cambió un input (costo, dosis, página) después de una corrida previa, eso es un **rerun**: subir VERSION y rehacer los archivos completos.\r
