[ ] Generar las imágenes-ad de los ángulos vírgenes (prompts en sección C)\r
[ ] Generar las 3 infografías del bot (prompts en sección C)\r
[ ] Configurar el flujo en LucidBot (sección E, campo por campo)\r
[ ] Subir creativos a Meta y revisar los anuncios (sección B + D)\r
[ ] Programar/activar la campaña a las 4 AM (sección F)\r
\r
── B. CREATIVOS POR CONJUNTO (qué va en cada uno) ──\r
[tabla: conjunto | formato (VIDEO archivo / IMAGEN) | archivo o prompt | precio en ad sí/no]\r
\r
── C. PROMPTS DE IMAGEN (copiar y pegar en Gemini/DALL·E) ──\r
[Prompts completos de los ads-imagen de ángulos vírgenes + los 3 prompts de infografías del bot, con todas las variables reemplazadas]\r
\r
