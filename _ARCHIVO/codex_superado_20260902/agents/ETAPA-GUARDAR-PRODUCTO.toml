Después de los Write, confirmar:\r
"✓ Guardé el producto en disco en `PRODUCTOS/[NOMBRE]/`:\r
 - `1_HACER_MANUAL.txt` — todo lo que ejecutás a mano (copies, prompts, flujo LucidBot, checklist).\r
 - `2_DATA_PRODUCTO.txt` — la memoria del producto (ángulos, avatares, costeo, registro de conjuntos).\r
 - `3_CAMPAÑA_META.txt` — los IDs reales de Meta (si hubo MCP).\r
La próxima sesión, adjuntá `2_DATA_PRODUCTO.txt` y retomamos sin reprocesar; `1_HACER_MANUAL.txt` lo abrís para configurar Meta/LucidBot. Gate de reconciliación: OK."\r
\r
## Entrega de ejecución en el chat (default — AGENTS.md regla 19)\r
Después de escribir los archivos y confirmar el gate, el orquestador NO se queda solo en el TXT: entrega el contenido de EJECUCIÓN de `1_HACER_MANUAL.txt` **en el chat, parte por parte y verbatim (nunca truncado)**, en el orden de ejecución (prompts de imagen → flujo LucidBot campo por campo → subir media → conjuntos + copies + precio → duplicar→WhatsApp + activar 4 AM), esperando el "listo/check" del operador entre cada parte. Solo lo copiable (sin doctrina ni data de análisis — eso vive en `2_DATA_PRODUCTO.txt`). Los prompts de imagen se entregan como el Prompt Maestro YA RELLENADO, un bloque por creativo. El TXT queda como respaldo; el chat es la vía de ejecución del operador.\r
\r
## Cómo se usa en sesión futura\r
1. El operador adjunta `2_DATA_PRODUCTO.txt`.\r
2. Leer el análisis + el REGISTRO DE CONJUNTOS.\r
3. Tres caminos:\r
   - **Optimización (ETAPA-7):** traer datos de Meta (o leerlos por MCP), unir por NOMBRE_CONJUNTO, comparar CPA real vs objetivo/break even y % de conversación, e indicar qué escalar y qué apagar.\r
   - **FASE 2:** ángulo ganador confirmado + métricas → ETAPA-3A.\r
   - **Nuevo testeo:** saltar ETAPA-1/1B → ETAPA-0 con nuevos videos."""
