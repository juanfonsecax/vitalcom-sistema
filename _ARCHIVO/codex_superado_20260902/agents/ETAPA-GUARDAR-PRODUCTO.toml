## SALIDA 4 — anexar a `PRODUCTOS/_DIM_CONJUNTOS.csv` (obligatorio, portafolio-wide)\r
\r
> **Qué es:** la tabla de DIMENSIONES que traduce el nombre crudo del conjunto en Meta a la semántica del sistema (ángulo, avatar, dolor, formato, tipo de hook, nivel de conciencia, rol de embudo, precio). Sin ella, las tablas de hechos son solo plata y clics: no se puede responder **qué ángulo / qué avatar / qué hook / qué formato funciona**, ni dentro de un producto ni entre productos.\r
>\r
> **Por qué es un CSV del portafolio y no una tabla dentro de `2_DATA_PRODUCTO.txt`:** el REGISTRO DE CONJUNTOS del `2_DATA` sigue existiendo (es la vista legible por producto), pero está en prosa y con nombres abreviados — no se puede agregar por él. El CSV es la capa máquina, con la MISMA llave que usan `_FACT_VENTAS.csv` y `_FACT_ENTREGA.csv`.\r
\r
**Regla dura de la llave:** `conjunto_meta` debe ser el **nombre EXACTO tal como quedó en Meta**, con sufijos incluidos (`- Copia`, `- Copia 2`), copiado de `3_CAMPAÑA_META.txt` o del export. **No normalizar, no abreviar, no corregir mayúsculas.** Si el mismo ángulo corre bajo dos nombres distintos, van **dos filas con el mismo `angulo_key`** — así se agregan juntas sin tocar Meta.\r
\r
Columnas (orden fijo):\r
```\r
producto_key, conjunto_meta, cuenta_alias, campana_clave, fase, angulo_key, angulo_nombre,\r
avatar, avatar_genero, avatar_edad, emocion_dominante, dolor_nucleo, formato, tipo_hook,\r
nivel_conciencia, rol_embudo, rol_embudo_origen,\r
lleva_precio, creativo_id, origen_angulo, estado, verificado_en_csv, fecha_alta, notas\r
```\r
\r
Vocabularios controlados (no inventar valores nuevos sin anotarlo):\r
- `avatar_genero`: MUJER · HOMBRE · MIXTO\r
- `avatar_edad`: 25-35 · 35-45 · 45-60 · 60+ — el bucket DOMINANTE, no el rango completo\r
- `emocion_dominante`: MIEDO_FUTURO · VERGUENZA · RESIGNACION · FRUSTRACION_MEDICA · DESCONFIANZA · AGOTAMIENTO · CURIOSIDAD\r
  Los declara ETAPA-2 en su ficha de ángulo. **Nunca dejarlos vacíos**: si un ángulo viejo no los\r
  trae, se rellenan leyendo su ficha en `2_DATA_PRODUCTO.txt`. Son lo que convierte la investigación\r
  de avatar en algo agregable — sin ellos el avatar muere en el copy y no se contrasta nunca contra\r
  quién compró. Con Andromeda pesan más que antes: el creativo es el targeting, así que el avatar\r
  solo se puede medir por lo que el creativo dice y retrata.\r
- `fase`: FASE1 · FASE2\r
- `formato`: VIDEO · IMAGEN\r
- `tipo_hook`: MIEDO · EMOCIONAL · TESTIMONIO · EDUCACIONAL · MECANISMO · OFERTA · PRUEBA_SOCIAL · ANTI_FALSIFICACION\r
- `nivel_conciencia`: 1 · 2 · 3 (admite 3a/3b/1-2 como en ETAPA-2). Vacío si no se declaró — **no inventarlo**.\r
- `rol_embudo`: TOFU · MOFU · BOFU — `rol_embudo_origen` = **DECLARADO** (lo dijo ETAPA-3B/ETAPA-4) o **DERIVADO_NC** (se dedujo del nivel de conciencia con la regla de abajo).\r
- `lleva_precio`: SI · NO → refleja lo **EJECUTADO** en Meta, no lo planificado. Si difieren, se anota la discrepancia en `notas`.\r
- `origen_angulo`: TRANSCRIPCION (ETAPA-0) · VOZ_REAL (ETAPA-1B) · PROBLEMA_OCULTO · GANADOR_PRIOR · MICROANGULO_3B\r
- `estado`: ACTIVO · PODADO · PAUSADO · NUNCA_ENTREGO\r
- `verificado_en_csv`: SI si el `conjunto_meta` ya aparece en `_FACT_VENTAS.csv` o `_FACT_ENTREGA.csv` (llave confirmada contra data real) · NO si todavía es solo diseño.\r
\r
Regla de derivación NC → rol de embudo (doctrina del sistema: el rol se mapea al nivel de conciencia de ETAPA-2):\r
`NC 1 → TOFU · NC 2 → TOFU · NC 3 → MOFU · tipo_hook=OFERTA → BOFU`. Se marca `rol_embudo_origen=DERIVADO_NC` para no leerlo como dato duro.\r
\r
**Cuándo se escribe:**\r
- **FASE 1**, al cerrar: una fila por cada uno de los 6 conjuntos (`verificado_en_csv=NO` hasta que gasten).\r
- **FASE 2**, al cerrar: una fila por microángulo, con `rol_embudo` DECLARADO por ETAPA-3B.\r
- **Al leer data** (ETAPA-7): si aparece un `conjunto_meta` que no está acá, se **anexa la fila** y se marca `verificado_en_csv=SI`. Nunca se descarta una fila de datos por falta de dimensión.\r
- Un rerun **actualiza** las filas del producto; no duplica. Llave única = (`producto_key`, `conjunto_meta`).\r
\r
