\r
> Es el único archivo que el operador abre para ejecutar. Todo verbatim, en orden, listo para copiar y pegar. Acá va lo que el sistema NO puede hacer solo: editar el flujo de LucidBot, subir creativos, generar imágenes.\r
\r
