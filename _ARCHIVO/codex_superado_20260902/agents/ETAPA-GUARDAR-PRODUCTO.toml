## SALIDA 5 — fila en `PRODUCTOS/_DIM_PRODUCTOS.csv` (obligatorio al dar de alta un producto)\r
\r
> **Qué es:** la tabla que traduce el `producto_key` a **dónde vive el producto en el disco**. El mismo producto tiene nombres distintos en las 4 ubicaciones (NUSAVA llegó a tener 5 grafías). Sin esta fila, ningún agente puede encontrar sus videos, transcripciones ni creativos sin adivinar.\r
\r
Además de los umbrales (`cpa_be_q`, `cpa_base_q`, tasa, cuenta, page_id), rellenar **las 5 columnas de carpeta**:\r
\r
| Columna | Qué apunta | Ejemplo (NUSAVA) |\r
|---|---|---|\r
| `slug_carpeta` | `PRODUCTOS/[X]/` | `NusavaB12` |\r
| `carpeta_videos` | `Ads/1.1 Videos/[X]/` | `NUSAVA B12` |\r
| `carpeta_transcripciones` | `Ads/1.2 Transcripcion videos/[X]/` | `NUSAVA B12` |\r
| `carpeta_media` | `Ads/[X]/` (lavados + ads-imagen) | `MEDIA_GTR7_NUSAVAB12` |\r
| `carpetas_extra` | sub-lotes / casos especiales | `NUSABA B12 ARDOR = sub-lote sin transcripciones` |\r
\r
**Reglas:**\r
- Se escriben con el **nombre EXACTO de la carpeta en disco**, tal como está — no se normaliza ni se corrige. La tabla se adapta al disco, no al revés.\r
- **Las carpetas NO se renombran para emparejarlas**: los `1_HACER_MANUAL.txt` referencian rutas `MEDIA_*` que el operador usa para ejecutar.\r
- Si el producto todavía no tiene alguna carpeta (ej. sin videos), se deja vacío y se anota en `carpetas_extra`.\r
- ⚠️ **Escribir este CSV con un escritor CSV real** (`csv.DictWriter`), nunca a mano: el campo `notas` lleva comas y **debe ir entre comillas dobles**. (Bug real 31-jul: la fila NUSAVA quedó con 20 campos en vez de 17 y la nota se truncaba.)\r
\r
