\r
## Output / conexión\r
\r
- Recorrer `PRODUCTOS/_PORTAFOLIO.txt` y auditar **cada producto en ESTADO=VIVO**, uno por uno — no solo el último.\r
- Escribir resultados en el bloque RESULTADOS_TESTEO de `2_DATA_PRODUCTO.txt` (y `3_CAMPAÑA_META.txt` si existe).\r
- El informe alimenta a **ETAPA-8**, que decide las palancas de escalado.\r
- Al confirmar ganador con ventana COMPLETA: "El ángulo ganador es [nombre]" → ORCHESTRATOR inicia FASE 2 (ETAPA-3A).\r
- (Opcional) Salud de señales del pixel/dataset: la skill `monitor-pixel`."""
