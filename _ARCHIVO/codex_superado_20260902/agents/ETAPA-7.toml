\r
## PASO 2 — SEÑALES DE ENTREGA POR MCP (secundario)\r
\r
Solo en cuentas con MCP ON (`GTR0`, `GTR7`, `GTR3`, `GTR1`). `GTR13` y `CP1` están OFF → para esas, este paso se salta y se dice en el informe.\r
\r
`ads_get_ad_entities(ad_account_id, level="adset", filtering=[{"field":"campaign.id","operator":"IN","value":["<campaign_id>"]}], fields=["name","amount_spent","impressions","clicks","actions:link_click","results","cost_per_result","cpm","ctr","frequency","reach"], date_preset=...)`\r
\r
- **Nunca fijar `campaign_id` a ciegas.** Listar las campañas de la cuenta y tomar la **ACTIVE cuyo nombre contenga la CLAVE_CAMPAÑA** del portafolio, con gasto > 0. El operador pausa, renombra y duplica (caso Nusava: la viva era "… - Copia").\r
- Tendencia día-a-día: `time_increment="1"`.\r
- `actions:omni_purchase` se puede leer como referencia, pero **jamás** como base del CPA.\r
\r
---\r
\r
## PASO 3 — DETECCIÓN DE SANGRADO (nuevo, obligatorio)\r
\r
Calcular y reportar SIEMPRE, arriba del ranking:\r
\r
```\r
SANGRADO = Σ gasto de los conjuntos con 0 ventas que YA superaron su Presupuesto de Decisión\r
         → expresarlo en Q, como % del gasto total, y como cuánta GANANCIA recupera podarlo\r
```\r
\r
Es la palanca más rentable del sistema y suele valer más que escalar. Ejemplo real (semana 17-24 jul): Q598 de sangrado = 26% del gasto; podarlo sube la ganancia neta de Q1,163 a ≈Q1,761 (+51%).\r
\r
---\r
\r
## Umbrales (NUNCA ROAS)\r
\r
- CPA real (por pedido): 🟢 ≤ CPA Base · 🟡 entre Base y Break Even · 🔴 > Break Even · ⚪ sin compras y gasto < Break Even (aún en aprendizaje = **sub-testeado**, ver PD abajo).\r
- **LOS GATES SON UMBRALES, NO DÍAS DEL CALENDARIO** (`CALENDARIO_ESCALADO.md` §1.5/§1.6). Cada conjunto corre su propio reloj desde su `fecha` de LANZAMIENTO en `_EVENTOS.csv`. Calcular y reportar por conjunto:\r
  · **edad** (días desde su lanzamiento) — no la edad de la campaña;\r
  · **`%PD` = gasto ÷ (1 × Break Even)** → gate de VENTA. A $2.99/día con 80% de entrega real llega al 100% en **3.3-4.3 días** según producto (a $1.59 tardaba 5.0-6.5);\r
  · **conversaciones acumuladas** → gate de ENTREGA. Corte de Etapa 1 con **≥30 conversaciones**; Meta sale de aprendizaje a las **50** (a $2.99 y $0.478/conv ≈ 6.3 conv/día).\r
  Un conjunto que no alcanzó su umbral se reporta como `ESPERANDO · X% del PD · madura el [fecha]` y **no se decide sobre él**. Así los lanzamientos entre semana no rompen el calendario.\r
- **CORTE DE ETAPA 1 → ETAPA 2** (día ~3, ≥30 conversaciones): recomendar apagar los 2-3 peores por conversación (%conv/clic-enlace <35% y/o $/conv > 2× la mediana del producto) y **subir los 3 sobrevivientes de $2.99 a $5.98**. Sale del MCP — no requiere LucidSales.\r
- **VARIABLES DE CONFUSIÓN:** antes de atribuir un resultado al ángulo, revisar `_EVENTOS.csv` en la ventana leída. Si hay un `CAMBIO_BOT`, `CAMBIO_CREATIVO`, `CAMBIO_PRECIO` o `CAMBIO_PAGINA` → **declararlo en el informe y no culpar al ángulo**. (Caso real CLEARSTEM 10-jul: bot nuevo + música de Meta el mismo día.)\r
- % conversación por clic-enlace: 🔴 <35% · 🟡 35–49% (bueno/escalable) · 🟢 ≥50% (50–70% súper escalable). (Clase 7 + Clase 15, Joaquín)\r
- % conversación por impresión: 🔴 <1.5% · 🟡 1.5–3.49% · 🟢 ≥3.5%.\r
- Fatiga: frecuencia ≥1.9 (fatiga creativa → cambiar creativo, Clase 4) · 2–3 con CPM/costo por conversación caro → apagar (Clase 7) · CTR cayendo >20% en 48h · CPM/costo por conversación subiendo >25% sin cambios de presupuesto.\r
- **Saturación por cuenta** (`ESCALADO_PLAYBOOK.md §5`): un ángulo que rinde ≥2× peor en una cuenta que la mediana de las otras está saturado ahí — mover volumen a las cuentas frescas, no renovar el ángulo.\r
\r
