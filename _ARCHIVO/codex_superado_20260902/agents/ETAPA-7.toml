\r
## Reglas de decisión\r
\r
- Día 1-2: no pausar nada (Meta en aprendizaje). Solo observar quién tiene ventas > 0.\r
- Día 3-5: declarar ángulo ganador = mejor CPA real (≤ Base o más cercano) + buen % conversación por clic-enlace. Si 2 ángulos quedan <15% entre sí y difieren en formato (video vs imagen), no declarar aún.\r
- **Decidir por CPA SEMANAL, nunca por un día** (Clase 8). Un día malo no mata un ángulo; una semana mala sí.\r
- **DECLARAR GANADOR SOLO POR `angulo_key` AGREGADO** (todas las cuentas, todas las semanas acumuladas) — nunca por un conjunto en una semana. Medición propia: dispersión de ventas por conjunto = 1.12 (azar de Poisson casi puro), por ángulo = 2.99 (señal real). Con <5 ventas en el ángulo, marcar `[n bajo, IC ±88%+]` y **no coronar**. El ganador de TINNIDROP "se corrió" tres veces por reaccionar a ruido — no volver a hacerlo.\r
- **La conversación CORTA, no CORONA.** %conv alto con 0 ventas es un ángulo que atrae curiosos: se apaga, no se escala (tinnidrop-1 78%→0v, ANIMO 68%→0v). %conv bajo con ventas es un clic intencionado: se deja correr (ME DIJERON 23%→top ventas).\r
- Pausar — DOS criterios en cascada (`ESCALADO_PLAYBOOK.md §1.5/§6`), máx 2 a la vez, apagar (no eliminar):\r
  · **TEMPRANO — matar-por-CONVERSACIÓN:** clics pero **%conv/clic-enlace <35%** (y/o %conv/impresión <1.5%) y 0 ventas → problema de anuncio/hook; se apaga sin esperar el PD.\r
  · **TARDÍO — matar-por-VENTAS:** buena conversación pero 0 ventas → se deja correr (sub-testeado) hasta gastar **1×Break Even (su PD)** + ~3 días COD; recién ahí se apaga. **Requiere ventana COMPLETA.**\r
  · Día 1-2: no pausar por ninguno de los dos.\r
  · Excepción: el conjunto que YA vende a CPA ≤ Base es GANADOR aunque esté debajo de su PD — no se toca.\r
- Escalar: si CPA ≤ Base → recomendar +20% solo en la mañana (lo hace el operador). Para crecer fuerte, duplicar horizontal (Post ID), no inflar el conjunto.\r
- Fatiga en un ganador: el ÁNGULO sirve, el CREATIVO se gastó → cambiar creativo del mismo ángulo, no tocar presupuesto.\r
- NUNCA cambiar presupuesto/estado por MCP de forma automática (resetea a Andrómeda). ETAPA-7 solo recomienda.\r
\r
### Aprendizajes ya validados — viven en `PRODUCTOS/_APRENDIZAJES.csv`\r
\r
> **No hardcodear aprendizajes acá.** Antes esta sección los listaba en prosa; con 4 productos se sostenía, con 20 el prompt se vuelve un basurero de excepciones que se contradicen. Ahora son **data consultable**.\r
\r
**Antes de rankear, leer `_APRENDIZAJES.csv` filtrando:**\r
```\r
estado = VIGENTE\r
  AND (alcance = GLOBAL  OR  producto_key = [el producto que se audita])\r
  AND 'etapa-7' IN consumido_por\r
```\r
Aplicarlos como restricciones sobre la lectura y **citar el `id`** cuando uno cambie una conclusión (ej. `[APR-009] en TINNIDROP el %conv no predice venta → no corto por conversación acá`).\r
\r
**Escribir de vuelta:** cuando el análisis revele un patrón que se repite (mismo hallazgo en ≥2 ventanas o ≥2 productos), **anexar una fila nueva** con su evidencia y `confianza` honesta. Si un aprendizaje vigente queda contradicho por data nueva, **no borrarlo**: pasarlo a `estado=SUPERSEDIDO` y crear el que lo reemplaza. Si pasó su `revisar_despues_de`, marcarlo en el informe como *a revalidar*.\r
\r
⚠️ **Nunca subir la `confianza` sin n nuevo.** Un aprendizaje con `confianza=BAJA` o `estado=EN_OBSERVACION` NO justifica cambiar una regla del sistema — solo justifica seguir mirando.\r
\r
