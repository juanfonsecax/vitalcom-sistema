## Informe diario (formato)\r
\r
```\r
INFORME DIARIO — [PRODUCTO] · Día [N] · [FECHA]\r
INTEGRIDAD DE VENTANA: [X] de 7 días  [COMPLETA ✅ / PARCIAL ⚠️ — faltan: ...]\r
Campaña: [nombre] · Gasto: $[X] / Q[X] · Ventas: [n] · Ingreso Q[X] · GANANCIA Q[X]\r
\r
SANGRADO: Q[X] ([Y]% del gasto) en [n] conjuntos con 0 ventas pasados de su PD\r
          → podarlo recupera Q[Z] de ganancia (+[W]%)\r
\r
RANKING DE CONJUNTOS (mejor → peor CPA real)\r
#1 [CONJUNTO] · ÁNGULO [..] · [video/imagen] · cuenta [alias]\r
   Ventas: [n] · CPA real: Q[..] (vs Base Q[..] / BE Q[..]) [🟢/🟡/🔴/⚪ %PD]\r
   %conv clic-enlace: [..]% · %conv impr: [..]% · Frecuencia: [..] · Fatiga: [sí/no]\r
   Estado: [GANADOR POTENCIAL / OBSERVAR / PAUSAR] · Acción: [1 línea]\r
[... los conjuntos ...]\r
\r
MATRIZ ÁNGULO × CUENTA (si el producto corre en >1 cuenta)\r
   [ángulo] → VIAJA (vende en ≥3) / LOCAL (1-2) / MURIENDO (fatiga de creativo)\r
\r
LECTURA POR DIMENSIÓN (join con _DIM_CONJUNTOS.csv — el "POR QUÉ funciona")\r
   SIN DIMENSIÓN: [n] filas  [debe ser 0]\r
   · por TIPO DE HOOK ...... [hook] Nv CPA Q[..]  |  ...  ← qué vena emocional compra este avatar\r
   · por FORMATO ........... VIDEO Nv Q[..] vs IMAGEN Nv Q[..]  ← ¿el formato decide o no?\r
   · por ROL DE EMBUDO ..... TOFU / MOFU / BOFU  ← dónde está el cuello del embudo\r
   · por PRECIO EN EL AD ... CON Nv Q[..] vs SIN Nv Q[..]  ← ¿el precio filtra o espanta?\r
   · por NIVEL CONCIENCIA .. 1 / 2 / 3\r
   Con <10 ventas en una celda, marcarla [n bajo] y NO decidir sobre ella.\r
\r
ÁNGULO(S) GANADOR(ES): [nombre + métricas]   ← omitir si la ventana es PARCIAL\r
PAUSAR: [matar-por-CONVERSACIÓN: %conv/clic-enlace <35% y 0 ventas → ya]\r
        [matar-por-VENTAS: gastó ≥1×BE (su PD) + ~3 días COD y 0 ventas → solo si ventana COMPLETA]\r
FATIGA: [creativo con frecuencia/CTR malos] → cambiar creativo, no el ángulo\r
